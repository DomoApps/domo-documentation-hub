# Sync OpenAPI Specifications and Update Navigation
#
# The api-registry pipeline pushes published public API YAMLs to a
# per-service branch named openapi-sync/<service>, cut from main with the
# YAMLs copied into openapi/product/. This workflow runs on that push, then:
#   1. finds the YAMLs that differ from main,
#   2. regenerates their docs.json navigation entries
#      (.github/scripts/update_api_nav.py),
#   3. prunes nav entries whose YAML no longer exists,
#   4. commits the nav changes to the same branch, and
#   5. opens a PR into main (an existing open PR is updated by the push).

name: Sync OpenAPI Specs

env:
  BASE_BRANCH: main
  DEST_YAML_PATH: openapi/product
  DOCS_JSON_PATH: ./docs.json
  OPENAPI_BASE_PATH: openapi/product

on:
  push:
    branches:
      - "openapi-sync/**"
    # The nav commit this workflow pushes only touches docs.json, so it does not re-trigger.
    paths:
      - "openapi/product/**"
  # Manual run. Defaults to a dry run: regenerates the nav and shows the
  # docs.json diff, but commits and opens nothing.
  workflow_dispatch:
    inputs:
      files:
        description: "YAMLs to regenerate nav for, space- or newline-separated (empty: those that differ from main)"
        required: false
        default: ""
      dry_run:
        description: "Show the docs.json diff only; don't commit or open a PR"
        type: boolean
        default: true
  # Same inputs, for running this workflow from another one
  workflow_call:
    inputs:
      files:
        type: string
        required: false
        default: ""
      dry_run:
        type: boolean
        default: true

# A newer push to the same branch (the pipeline rebuilds it each run) supersedes an in-flight run.
concurrency:
  group: openapi-sync-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # App token (not GITHUB_TOKEN) so the PR and the nav commit trigger the
      # standard checks (link-check, mint-preview, case-collision-check).
      - name: Generate Destination Repo Token
        if: inputs.dry_run != true
        uses: actions/create-github-app-token@v1
        id: dest-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A dry run commits nothing, so it doesn't need the App token
          token: ${{ steps.dest-token.outputs.token || github.token }}

      - name: Find changed YAML files
        id: changed
        env:
          INPUT_FILES: ${{ inputs.files }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_FILES:-}" ]; then
            # Files named by a manual run
            CHANGED=$(echo "$INPUT_FILES" | tr ' ' '\n' | sed '/^$/d')
            while IFS= read -r f; do
              [ -f "$f" ] || { echo "::error::No such file: $f"; exit 1; }
            done <<< "$CHANGED"
          else
            git fetch origin "${BASE_BRANCH}"
            CHANGED=$(git diff --name-only --diff-filter=ACMRT "origin/${BASE_BRANCH}...HEAD" -- \
              "${DEST_YAML_PATH}/*.yaml" "${DEST_YAML_PATH}/*.yml" || true)
          fi

          if [ -z "$CHANGED" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No OpenAPI YAML changes relative to ${BASE_BRANCH}."
            exit 0
          fi

          echo "Changed YAML files:"
          echo "$CHANGED" | sed 's/^/  - /'
          {
            echo "has_changes=true"
            echo "files<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Python for the nav scripts below (update_api_nav.py, prune_stale_nav.py)
      - name: Set up Python
        if: steps.changed.outputs.has_changes == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Rebuilds each changed spec's group under Product APIs. Fails if the
      # Product APIs group can't be found, rather than committing nothing.
      - name: Update API Navigation
        if: steps.changed.outputs.has_changes == 'true'
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          YAMLS=()
          while IFS= read -r f; do [ -n "$f" ] && YAMLS+=("$f"); done <<< "$FILES"
          python .github/scripts/update_api_nav.py \
            --docs-json "${DOCS_JSON_PATH}" \
            --openapi-base-path "${OPENAPI_BASE_PATH}" \
            "${YAMLS[@]}"

      # Remove any OpenAPI nav entries in docs.json that reference YAMLs no
      # longer on disk, otherwise Mintlify preview deploys fail.
      - name: Prune stale OpenAPI nav entries
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          python .github/scripts/prune_stale_nav.py \
            --docs-json "${{ env.DOCS_JSON_PATH }}" \
            --repo-root .

      - name: Show navigation changes (dry run)
        if: steps.changed.outputs.has_changes == 'true' && inputs.dry_run == true
        run: |
          set -euo pipefail
          if git diff --quiet -- "${DOCS_JSON_PATH}"; then
            echo "docs.json navigation already up to date." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --stat -- "${DOCS_JSON_PATH}"
          git diff -- "${DOCS_JSON_PATH}"
          {
            echo "### docs.json navigation changes (dry run, not committed)"
            echo '```diff'
            git diff -- "${DOCS_JSON_PATH}" | head -n 500
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload docs.json (dry run)
        if: steps.changed.outputs.has_changes == 'true' && inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: docs-json-dry-run
          path: ${{ env.DOCS_JSON_PATH }}

      - name: Commit navigation changes to the sync branch
        if: steps.changed.outputs.has_changes == 'true' && inputs.dry_run != true
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- "${DOCS_JSON_PATH}"; then
            echo "docs.json navigation already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${DOCS_JSON_PATH}"
          git commit -m "docs: update API navigation"
          if ! git push origin "HEAD:${BRANCH}"; then
            # Two runs can start on the same push; the one that loses the race is rejected as
            # non-fast-forward. If the branch already has the same docs.json we would have
            # pushed, a concurrent run did the work and there is nothing left to do.
            git fetch origin "${BRANCH}"
            if git diff --quiet FETCH_HEAD HEAD -- "${DOCS_JSON_PATH}"; then
              echo "Navigation changes were already pushed by a concurrent run."
            else
              echo "::error::Push rejected and the branch has different docs.json content - was it updated mid-run?"
              exit 1
            fi
          fi

      - name: Open pull request
        if: steps.changed.outputs.has_changes == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ steps.dest-token.outputs.token }}
          BRANCH: ${{ github.ref_name }}
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -euo pipefail
          EXISTING=$(gh pr list --head "$BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING is already open for $BRANCH; the push updated it."
            exit 0
          fi

          SERVICE="${BRANCH#openapi-sync/}"
          FILE_LIST=$(echo "$FILES" | sed 's|^|- `|; s|$|`|')
          BODY=$(printf '%s\n' \
            "## OpenAPI Specification Update" \
            "" \
            "Pushed by the api-registry pipeline for \`${SERVICE}\`, with navigation regenerated." \
            "" \
            "### Files" \
            "$FILE_LIST" \
            "" \
            "---" \
            "*This PR was created automatically by the OpenAPI sync workflow.*")

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "docs: Update OpenAPI spec(s) from ${SERVICE}" \
            --body "$BODY"
