# Sync OpenAPI Specifications and Update Navigation
#
# The pipeline-shared-library (generateApiV4) pushes published public API YAMLs
# to a per-service branch named openapi-sync/<service>, cut from main with the
# YAMLs copied into openapi/product/. This workflow runs on that push, then:
#   1. finds the YAMLs that differ from main,
#   2. regenerates their docs.json navigation entries,
#   3. prunes nav entries whose YAML no longer exists,
#   4. commits the nav changes to the same branch, and
#   5. opens a PR into main (an existing open PR is updated by the push).

name: Sync OpenAPI Specs

env:
  BASE_BRANCH: main
  DEST_YAML_PATH: openapi/product
  DOCS_JSON_PATH: ./docs.json
  OPENAPI_BASE_PATH: openapi/product

on:
  push:
    branches:
      - "openapi-sync/**"
    # The nav commit this workflow pushes only touches docs.json, so it does not re-trigger.
    paths:
      - "openapi/product/**"

# A newer push to the same branch (the pipeline rebuilds it each run) supersedes an in-flight run.
concurrency:
  group: openapi-sync-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # App token (not GITHUB_TOKEN) so the PR and the nav commit trigger the
      # standard checks (link-check, mint-preview, case-collision-check).
      - name: Generate Destination Repo Token
        uses: actions/create-github-app-token@v1
        id: dest-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.dest-token.outputs.token }}

      - name: Find changed YAML files
        id: changed
        run: |
          set -euo pipefail
          git fetch origin "${BASE_BRANCH}"
          CHANGED=$(git diff --name-only --diff-filter=ACMRT "origin/${BASE_BRANCH}...HEAD" -- \
            "${DEST_YAML_PATH}/*.yaml" "${DEST_YAML_PATH}/*.yml" || true)

          if [ -z "$CHANGED" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No OpenAPI YAML changes relative to ${BASE_BRANCH}."
            exit 0
          fi

          echo "Changed YAML files:"
          echo "$CHANGED" | sed 's/^/  - /'
          {
            echo "has_changes=true"
            echo "files<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update API Navigation
        id: nav
        if: steps.changed.outputs.has_changes == 'true'
        uses: DomoApps/documentation-generator-action@main
        with:
          yaml_input_path: "./${{ env.DEST_YAML_PATH }}"
          docs_json_path: "${{ env.DOCS_JSON_PATH }}"
          openapi_base_path: "${{ env.OPENAPI_BASE_PATH }}"
          process_changed_only: "true"
          changed_files: ${{ steps.changed.outputs.files }}

      # The generator re-serializes docs.json even when it inserts nothing (for
      # example if it can't find the Product APIs group), which would otherwise
      # land as a formatting-only commit. Drop that rewrite and say so loudly.
      - name: Discard no-op navigation rewrite
        if: steps.changed.outputs.has_changes == 'true' && steps.nav.outputs.groups_updated == '0'
        run: |
          echo "::warning::Navigation generator updated 0 groups for the changed YAMLs - docs.json nav was NOT updated. Check the 'Update API Navigation' log."
          git checkout -- "${DOCS_JSON_PATH}"

      # Remove any OpenAPI nav entries in docs.json that reference YAMLs no
      # longer on disk, otherwise Mintlify preview deploys fail.
      - name: Prune stale OpenAPI nav entries
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          python .github/scripts/prune_stale_nav.py \
            --docs-json "${{ env.DOCS_JSON_PATH }}" \
            --repo-root .

      - name: Commit navigation changes to the sync branch
        if: steps.changed.outputs.has_changes == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- "${DOCS_JSON_PATH}"; then
            echo "docs.json navigation already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${DOCS_JSON_PATH}"
          git commit -m "docs: update API navigation"
          git push origin "HEAD:${BRANCH}"

      - name: Open pull request
        if: steps.changed.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.dest-token.outputs.token }}
          BRANCH: ${{ github.ref_name }}
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -euo pipefail
          EXISTING=$(gh pr list --head "$BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING is already open for $BRANCH; the push updated it."
            exit 0
          fi

          SERVICE="${BRANCH#openapi-sync/}"
          FILE_LIST=$(echo "$FILES" | sed 's|^|- `|; s|$|`|')
          BODY=$(printf '%s\n' \
            "## OpenAPI Specification Update" \
            "" \
            "Pushed by the api-registry pipeline for \`${SERVICE}\`, with navigation regenerated." \
            "" \
            "### Files" \
            "$FILE_LIST" \
            "" \
            "---" \
            "*This PR was created automatically by the OpenAPI sync workflow.*")

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "docs: Update OpenAPI spec(s) from ${SERVICE}" \
            --body "$BODY"
