name: Sync Minor Release Notes

# Rebuilds s/article/Current-Minor-Release-Notes.mdx from the Domo hotfix
# enrichment DataSet: selects the week's publishable notes (score >= 7, not yet
# published), restyles each into house voice, archives the outgoing week into a
# dated file + docs.json nav, then pushes to the `auto/minor-release-notes`
# branch and opens or updates a PR for review. Nothing publishes until merged.
#
# Runs Friday mornings (13:17 UTC ~ 6-7am Mountain), just before the release is
# cut, and on demand.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   DOMO_DEVELOPER_TOKEN   Domo developer access token
#                          (instance: Admin -> Authentication -> Access Tokens)
#   ANTHROPIC_API_KEY      Anthropic API key for the style rewrite
#
# Required repo variable (... -> Variables):
#   DOMO_MINOR_RN_DATASET_ID  GUID of the HOTFIX_Release_Enriched_PUBLIC DataSet
#
# Optional repo variable:
#   DOMO_INSTANCE          Domo instance host (default: domo.domo.com)

on:
  schedule:
    - cron: "17 13 * * 5" # Friday, 13:17 UTC (off the contended top-of-hour)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-minor-release-notes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Anthropic SDK
        run: pip install anthropic

      - name: Rebuild Minor Release Notes from Domo
        env:
          DOMO_DEVELOPER_TOKEN: ${{ secrets.DOMO_DEVELOPER_TOKEN }}
          DOMO_MINOR_RN_DATASET_ID: ${{ vars.DOMO_MINOR_RN_DATASET_ID }}
          DOMO_INSTANCE: ${{ vars.DOMO_INSTANCE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/build_minor_release_notes.py

      - name: Commit, push, and open/update PR
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="auto/minor-release-notes"
          PATHS="s/article/Current-Minor-Release-Notes.mdx docs.json tracking/minor-release-ledger.json s/article/Minor-Release-*.mdx"

          if [ -z "$(git status --porcelain -- $PATHS)" ]; then
            echo "No new minor release notes this week — nothing to sync."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add -- $PATHS
          git commit -m "chore: sync Minor Release Notes ($(date -u +%F))"
          git push --force origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Updated existing PR #$EXISTING (push refreshed it)."
            PR_NUMBER="$EXISTING"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Sync Minor Release Notes" \
              --body "Automated draft of this week's Minor Release Notes from the Domo hotfix DataSet. The previous week has been archived under **Archived Minor Release Notes**. Review the drafted bullets (restyled from the source notes) and merge to publish with the Friday release."
            PR_NUMBER=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      # Auto-PRs opened with GITHUB_TOKEN don't trigger the standard preview
      # workflow, so trigger a Mintlify preview for the branch directly here.
      - name: Trigger Mintlify preview
        id: preview
        if: steps.push.outputs.changed == 'true'
        env:
          MINTLIFY_TOKEN: ${{ secrets.MINTLIFY_KEY }}
          MINTLIFY_PROJECT_ID: ${{ secrets.MINTLIFY_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${MINTLIFY_TOKEN:-}" ] || [ -z "${MINTLIFY_PROJECT_ID:-}" ]; then
            echo "::warning::MINTLIFY_KEY / MINTLIFY_PROJECT_ID not set — skipping preview."
            exit 0
          fi
          HTTP_STATUS=$(curl --silent --show-error \
            --write-out '%{http_code}' --output /tmp/mint-response.json \
            -X POST "https://api.mintlify.com/v1/project/preview/${MINTLIFY_PROJECT_ID}" \
            -H "Authorization: Bearer ${MINTLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"branch": "auto/minor-release-notes"}')
          echo "HTTP $HTTP_STATUS"; cat /tmp/mint-response.json || true; echo ""
          if [ "$HTTP_STATUS" != "202" ]; then
            echo "::warning::Mintlify preview trigger returned HTTP $HTTP_STATUS."
            exit 0
          fi
          PREVIEW_URL=$(jq -r '.previewUrl // empty' /tmp/mint-response.json)
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: steps.push.outputs.changed == 'true' && steps.preview.outputs.preview_url != '' && steps.push.outputs.pr_number != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          number: ${{ steps.push.outputs.pr_number }}
          header: mintlify-preview
          message: |
            ### Mintlify preview

            **[Open preview](${{ steps.preview.outputs.preview_url }})** — built from `auto/minor-release-notes`.

            <sub>Updated on each automated sync. Preview deploys can take a minute or two — refresh if it shows a build-in-progress splash.</sub>
