extends: substitution
message: "Use '%s' instead of '%s'. The Dojo is now the Community Forums."
level: warning
ignorecase: false
nonword: true
scope: raw
swap:
  'https?://(?:[\w.-]+/)?dojo\.domo\.com/?(?=[\s)\]"]|$)': https://community-forums.domo.com/main
  'https?://dojo\.domo\.com/[^\s)\]("]+': the matching community-forums.domo.com page
  '(?<![/\w.])dojo\.domo\.com\b': community-forums.domo.com
  '\bDojo\b': Community Forums
