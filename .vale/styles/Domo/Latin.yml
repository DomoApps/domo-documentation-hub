extends: substitution
message: "Avoid Latin abbreviations. Use '%s' instead of '%s', or rewrite the sentence."
link: https://www.domo.com/docs/Domo-KB-Style-Guide#word-choice-and-punctuation
level: warning
ignorecase: true
nonword: true
swap:
  '\bi\.e\.': that is
  '\be\.g\.': such as
  '\betc\.': end the list or rewrite
