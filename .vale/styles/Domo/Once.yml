extends: existence
message: "Use 'after' instead of 'once' for a sequence of actions. 'Once' is ambiguous and causes problems in translation."
link: https://www.domo.com/docs/Domo-KB-Style-Guide#word-choice-and-punctuation
level: suggestion
ignorecase: true
tokens:
  - 'once (?:you|the|your|this|that|it|all)'
