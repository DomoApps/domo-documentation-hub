extends: substitution
message: "Use '%s' instead of '%s'."
link: https://www.domo.com/docs/Domo-KB-Style-Guide#word-choice-and-punctuation
level: warning
ignorecase: false
swap:
  '(?i)utiliz(?:e|es|ed|ing)': use
  '(?i)verbiage': words
  '(?i)whitelist(?:s|ed|ing)?': allowlist
  '(?i)blacklist(?:s|ed|ing)?': blocklist
  '(?i)drilldowns?': Drill Path
  '(?i)beastmode': Beast Mode
  '(?i)domofusion': DataFusion
  '(?i)KPI cards?': Visualization Card
  '(?i)Image cards?': Doc Card
  Slicers?: Quick Filter
  Page Filters?: Dashboard Filter
