  /domo/datastores/v1/collections/{collectionName}/documents/{documentId}:
    get:
      x-excluded: true
      summary: Get Document (v1)
      description: Retrieves a single document from a collection.
      tags:
      - AppDB API
      parameters:
        - name: collectionName
          in: path
          required: true
          schema:
            type: string
        - name: documentId
          in: path
          required: true
          description: The UUID of the document
          schema:
            type: string
            format: uuid
      x-codeSamples:
        - lang: JavaScript
          label: domo.js
          source: |-
            const collectionName = 'YourCollection';
            const documentId = 'your-document-id';

            domo.get(`/domo/datastores/v1/collections/${collectionName}/documents/${documentId}`)
              .then(doc => console.log(doc));
        - *stub_curl
        - *stub_python
        - *stub_php
        - *stub_go
        - *stub_java
        - *stub_ruby
      responses:
        '200':
          description: Document retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
              example:
                id: "402778f6-bc8d-4aa5-a581-e08e3fc98c05"
                datastoreId: "daee775a-3be4-410d-ba20-bb0d94ce51cb"
                collectionId: "2148c830-14c2-478f-bb14-5c3019de46b4"
                syncRequired: true
                owner: 540824222
                createdOn: "2026-07-31T23:09:34.542Z"
                updatedOn: "2026-07-31T23:09:34.542Z"
                updatedBy: 540824222
                content:
                  name: "Harry Potter"
                  house: "Gryffindor"
                  wand:
                    wood: "holly"
                    core: "phoenix feather"
                    length: 11
                  courses:
                    - "Defense Against the Dark Arts"
                    - "Potions"
                    - "Transfiguration"
                  enrolledOn: "1991-09-01"
                  lastDetention: "1994-06-08T20:00:00Z"
        '404':
          description: Document not found

    put:
      x-excluded: true
      summary: Update Document (v1)
      description: Updates an existing document in a collection.
      tags:
      - AppDB API
      parameters:
        - name: collectionName
          in: path
          required: true
          schema:
            type: string
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUpdate'
            example:
              content:
                name: "Harry Potter"
                house: "Gryffindor"
                wand:
                  wood: "holly"
                  core: "phoenix feather"
                  length: 11
                courses:
                  - "Defense Against the Dark Arts"
                  - "Potions"
                  - "Transfiguration"
                prefect: false
      x-codeSamples:
        - lang: JavaScript
          label: domo.js
          source: |-
            const collectionName = 'Students';
            const documentId = '402778f6-bc8d-4aa5-a581-e08e3fc98c05';

            // PUT replaces the entire document — include all fields, not just the ones changing.
            // Harry was notably never made a prefect (that honor went to Ron in book 5).
            domo.put(`/domo/datastores/v1/collections/${collectionName}/documents/${documentId}`, {
              content: {
                name: 'Harry Potter',
                house: 'Gryffindor',
                wand: { wood: 'holly', core: 'phoenix feather', length: 11 },
                courses: ['Defense Against the Dark Arts', 'Potions', 'Transfiguration'],
                prefect: false
              }
            }).then(doc => console.log(doc));
