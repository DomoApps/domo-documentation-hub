              example:
                status: 403
                statusReason: "status 403 reading CollectionsResourceClient#deleteCollection(UUID); content:\n{\"status\":403,\"toe\":\"AIFZ3S4ZR9-CVL5Q-1FOQC\"}"
                toe: "AIFZ3S4ZR9-CVL5Q-1FOQC"
        '404':
          description: No collection with that name exists in this app's datastore. Check that you are using the exact collection name, including case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 404
                statusReason: "status 404 reading CollectionsResourceClient#deleteCollection(UUID); content:\n{\"message\":\"No collection with id 1b9eebac-e9b0-4e98-b218-34d4d751d15b found\",\"status\":404,\"statusReason\":\"Not Found\",\"toe\":\"CUDX3VBUXC-8BF1P-DXONT\"}"
                toe: "CUDX3VBUXC-8BF1P-DXONT"

  /domo/datastores/v1/export:
    post:
      summary: Sync Collections
      description: |
        Manually trigger a sync of this card's collections to their linked Domo DataSets.
        Only syncEnabled collections with pending changes are synced. Returns an empty body on success.

        By default, only the collections in this card's own datastore are synced. Set
        `includeRelatedCollections=true` to also sync any additional collections listed
        in the app design's `collectionsMapping` — this is useful for designs that declare
        **shared collections** with a fixed UUID, which are the same collection reused
        across all instances of the design.

        <Warning>
        **Collections won't sync if the collection owner lacks permissions on the target DataSet.** If that user is removed from Domo, syncing stops. The new owner must have both Collection ownership and Admin Permissions.
        </Warning>
      tags:
      - AppDB API
      parameters:
        - name: includeRelatedCollections
          in: query
          description: >-
            When `false` (default), syncs only the collections in this card's own datastore.
            When `true`, also syncs any additional collections listed in the app design's
            `collectionsMapping` alongside this card's own collections. Primarily useful for
            designs that declare shared collections with a fixed UUID — collections that are
            the same across all instances of the design.
          schema:
            type: boolean
            default: false
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example: {}
      x-codeSamples:
        - lang: JavaScript
          label: domo.js
          source: |-
            // Sync this card's own collections
            domo.post('/domo/datastores/v1/export')
              .then(() => console.log('sync started'));

            // Also sync related collections (collectionsMapping)
            domo.post('/domo/datastores/v1/export?includeRelatedCollections=true')
              .then(() => console.log('sync started'));
        - lang: JavaScript
          label: domo.js v6
          source: |-
            // domo.js v6

            // Sync this card's own collections
            await domo.appdb.export();
            console.log('sync started');
        - *stub_curl
        - *stub_python
        - *stub_php
        - *stub_go
        - *stub_java
        - *stub_ruby
      responses:
        '200':
          description: Sync accepted and running asynchronously. No response body is returned.
        '423':
          description: Sync already in progress (LOCKED). Retry once the current sync completes.

  /domo/datastores/v1/collections/{collectionName}/permission/{entity}/{entityId}:
    put:
      summary: Modify Collection Permissions
      description: |
        Modify the permissions for a user, group, or app instance on a collection.

        ## Permission Inheritance
        **Users and groups inherit** permissions from the app, so often the most convenient thing is to give the _app_ the permissions you want all people to have. Anyone who gets the app shared with them inherits its permissions on the collection and its documents. By **default**, apps are given the following permissions on their collections: `read`, `create_content`, `read_content`, `update_content`, and `delete_content`.

        You can set the app permissions with this API or using the **wiring screen** of an app card.

        ## Direct Permissions
        However, in situations where not everyone should be able to create, update or delete documents, you'll need a more nuanced permission model. You can give individual users and groups permissions using this API or [AppDB Admin](/s/article/9221297758615). 
        
        When you need control down to the document level, you can leverage [Document-level Security](/portal/API-Reference/app-framework-apis/AppDB-API#document-level-security).

        <Info>**Adds by default.** This endpoint **adds to** existing permissions, unless you pass `overwrite=true`. Then it will **replace** the entire permission set for that entity with the permissions you specify. To remove all permissions for an entity, use [Delete Permissions](/api-reference/appdb-api/delete-permissions).</Info>

        ## Available Permissions

        | Permission       | Grants |
        | ---------------- | ------ |
        | `admin`          | All permissions to the collection and its documents |
        | `write`          | Update the collection's properties |
        | `read`           | Read the collection's properties |
        | `share`          | Add or remove permissions this entity already holds |
        | `delete`         | Delete the collection or its documents |
        | `create_content` | Create documents in the collection |
        | `update_content` | Update documents in the collection |
        | `read_content`   | Read documents in the collection |
        | `delete_content` | Delete documents from the collection |

        Removing all entity permissions leaves only users with the **Manage AppDB** grant with access.
      tags:
      - AppDB API
      parameters:
        - name: collectionName
          in: path
          required: true
          schema:
            type: string
        - name: entity
          in: path
          required: true
          description: Type of entity
          schema:
            type: string
            enum: [USER, GROUP, RYUU_APP]
        - name: entityId
          in: path
          required: true
          description: ID of the user, group, or app instance; for apps, the id is the same as the datastore UUID and also appears as the subdomain of the app's origin (e.g., `https://<instance-uuid>.domoapps.domo.com`).
          schema:
            type: string
        - name: permissions
          in: query
          required: true
          description: One or more permissions to apply. Pass as a comma-separated list.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - admin
                - write
                - read
                - share
                - delete
                - create_content
                - update_content
                - read_content
                - delete_content
          example: "read,create_content,update_content,read_content"
        - name: overwrite
          in: query
          required: false
          description: |
            Controls how the specified permissions are applied to the entity's existing permission set.

            - `false` (default) — **additive**: merges the specified permissions with any permissions the entity already holds.
            - `true` — **replace**: discards the entity's existing permissions and replaces them with exactly the permissions you specify.
          schema:
            type: boolean
            default: false
      x-codeSamples:
        - lang: JavaScript
          label: domo.js
          source: |-
            const collectionName = 'YourCollection';

            // Add permissions to a user's existing set (additive, default behavior)
            const userId = '540824222';
            domo.put(
              `/domo/datastores/v1/collections/${collectionName}/permission/USER/${userId}?permissions=read,create_content,read_content,update_content,delete_content`
            ).then(() => console.log('user permissions updated'));

            // Replace the app instance's permission set entirely (overwrite=true)
            // The instance UUID is the subdomain of the app's origin URL.
            const instanceId = window.location.hostname.split('.')[0];
            domo.put(
              `/domo/datastores/v1/collections/${collectionName}/permission/RYUU_APP/${instanceId}?permissions=read,read_content&overwrite=true`
            ).then(() => console.log('app permissions replaced'));
        - *stub_curl
        - *stub_python
        - *stub_php
        - *stub_go
        - *stub_java
        - *stub_ruby
      responses:
        '200':
          description: Permissions updated successfully. No response body is returned.
        '403':
          description: You do not have the SHARE permission on this collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 403
                statusReason: "status 403 reading CollectionsResourceClient#setCollectionPermissions(UUID,String,String,Set,Boolean); content:\n{\"message\":\"The item you're looking for can not be found\",\"status\":403,\"statusReason\":\"Forbidden\",\"toe\":\"6CPYAXAZXA-8DYRE-V4TQC\"}"
                toe: "6CPYAXAZXA-8DYRE-V4TQC"
        '404':
          description: No collection with that name exists in this app's datastore. Check that you are using the exact collection name, including case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 404
                statusReason: "DA0088: Collection 'T' was not found in datastore fcd8baba-9524-4fb5-b94b-b3d3b588e740 - it may not exist on this instance or may not be accessible"
                toe: "DSKD0CWR0C-NTWA3-UNZVI"

    delete:
      summary: Delete Permissions
      description: You can remove all permissions for an entity using the endpoint below. If all entities' permissions are removed, then only users with the Manage AppDB grant will still have access.
      tags:
