      description: "Update existing documents or create new ones in bulk. Documents with a matching `id` are updated; documents without a matching `id` are created. Each document is limited to 2 MB."
      tags:
      - AppDB API
      parameters:
        - name: collectionName
          in: path
          required: true
          schema:
            type: string
            description: The name given to the collection in the manifest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  content:
                    type: object
                    additionalProperties: true
            example:
              - id: "402778f6-bc8d-4aa5-a581-e08e3fc98c05"
                content:
                  name: "Harry Potter"
                  house: "Gryffindor"
                  wand:
                    wood: "holly"
                    core: "phoenix feather"
