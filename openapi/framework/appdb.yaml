openapi: 3.0.0
info:
  title: Domo AppDB API
  version: v1
  description: |
    AppDB API for storing arbitrary JSON documents similar to a NoSQL database. This enables storing state within your DomoApp
    with optional syncing to Domo DataSets.

    Three layers provide data storage:
    - **Datastores**: Analogous to a database. A CustomApp has a single datastore created automatically.
    - **Collections**: Analogous to a collection in NoSQL or table in relational databases.
    - **Documents**: Analogous to documents in NoSQL or table rows in relational databases.

servers:
  - url: 'https://{instance}.domo.com'
    description: Domo Instance
    variables:
      instance:
        default: example
        description: Your Domo instance name

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: A human-readable error message

    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the Document
        owner:
          type: string
          description: "User ID of the Document owner."
        createdBy:
          type: string
          description: "User ID of the user who created the Document."
        datastoreId:
          type: string
          format: uuid
          description: "Unique identifier of the Datastore that this Document's Collection belongs to."
        collectionId:
          type: string
          format: uuid
          description: "Unique identifier of the Collection this Document belongs to."
        createdOn:
          type: string
          format: date-time
          description: "The ISO-8601 timestamp showing when this Document was created."
        updatedOn:
          type: string
          format: date-time
          description: "The ISO-8601 timestamp showing when this Document was last updated."
        updatedBy:
          type: string
          description: "User ID of the user who last updated the Document."
        content:
          type: object
          additionalProperties: true
          description: The actual Document content
        syncRequired:
          type: boolean
          description: Whether or not this Document needs to be synced by Domo to the associated DataSet; only applies if the `syncEnabled` option is on for the Collection.
      example:
        id: "c023b254-647e-4839-b74b-b050d4c17447"
        datastoreId: "5565fecc-a852-4799-83bf-f9423c0f7687"
        collectionId: "a3aaeeed-5210-4048-9ff0-d88fa0de4eda"
        syncRequired: true
        owner: "870010733"
        createdBy: "870010733"
        createdOn: "2026-06-25T01:33:56.332Z"
        updatedOn: "2026-06-25T01:33:56.332Z"
        updatedBy: "870010733"
        content:
          name: "Harry Potter"
          house: "Gryffindor"
          wand:
            wood: "holly"
            core: "phoenix feather"
            length: 11
          courses:
            - "Defense Against the Dark Arts"
            - "Potions"
            - "Transfiguration"
          enrolledOn: "1991-09-01"
          lastDetention: "1994-06-08T20:00:00Z"

    DocumentCreate:
      type: object
      required:
        - content
      properties:
        content:
          type: object
          additionalProperties: true
          description: The document content matching collection schema

    DocumentUpdate:
      type: object
      required:
        - content
      properties:
        content:
          type: object
          additionalProperties: true
          description: Updated document content

    Collection:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the collection.
        owner:
          type: integer
          format: int64
          description: User ID of the collection owner.
        datastoreId:
          type: string
          format: uuid
          description: ID of the datastore this collection belongs to.
        name:
          type: string
          description: Name of the collection.
        datasourceId:
          type: string
          format: uuid
          nullable: true
          description: ID of the linked Domo DataSet, or null if not yet linked.
        defaultPermissions:
          nullable: true
          description: "Comma-separated default permission set for new app grants on this collection, or null if not set."
        requiredAuthorities:
          nullable: true
          description: "Maps CollectionOperation names to required authority strings, or null if not set."
        filters:
          nullable: true
          description: "Array of document-level filter predicates applied to read operations, or null if not set."
        schema:
          $ref: '#/components/schemas/Schema'
        syncEnabled:
          type: boolean
          description: Whether documents are periodically synced to the linked DataSet.
        syncRequired:
          type: boolean
          description: Whether a sync is pending.
        fullReplaceRequired:
          type: boolean
        lastSync:
          type: string
          format: date-time
          nullable: true
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
        updatedBy:
          type: integer
          format: int64
      example:
        id: "a3aaeeed-5210-4048-9ff0-d88fa0de4eda"
        datastoreId: "5565fecc-a852-4799-83bf-f9423c0f7687"
        defaultPermissions: null
        requiredAuthorities: null
        owner: 870010733
        name: "Students"
        datasourceId: null
        schema:
          columns:
            - type: "STRING"
              name: "name"
            - type: "STRING"
              name: "house"
        filters: null
        syncEnabled: false
        syncRequired: false
        fullReplaceRequired: false
        lastSync: null
        createdOn: "2026-06-25T01:26:34.744Z"
        updatedOn: "2026-06-25T01:26:34.744Z"
        updatedBy: 870010733

    CollectionCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the collection
        schema:
          $ref: '#/components/schemas/Schema'
        syncEnabled:
          type: boolean
          default: false
          description: >-
            Turning this property on causes the documents in your collection to be converted into rows in a DataSet every 15 minutes.
            Only the properties defined in the schema are synced.
            Requires `schema` to be provided — returns a 400 if `syncEnabled: true` is passed without a schema.

    Schema:
      type: object
      properties:
        columns:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
                enum: [STRING, LONG, DECIMAL, DOUBLE, DATE, DATETIME]
                description: The type of value. Dates must be formatted as `YYYY-MM-DD`. DateTimes must be formatted as `YYYY-MM-DDTHH:MM:SSZ`.

    MongoQuery:
      type: object
      additionalProperties: true
      description: MongoDB query object
      example:
        content.wand.core: "phoenix feather"

    PartialUpdateRequest:
      type: object
      required:
        - query
        - operation
      properties:
        query:
          type: object
          additionalProperties: true
          description: MongoDB query to match documents
        operation:
          type: object
          additionalProperties: true
          description: MongoDB update operation

    BulkCreateResponse:
      type: object
      properties:
        Created:
          type: integer
      example:
        Created: 2

    BulkUpsertResponse:
      type: object
      properties:
        Updated:
          type: integer
        Created:
          type: integer
      example:
        Updated: 1
        Created: 1

    BulkDeleteResponse:
      type: object
      properties:
        Deleted:
          type: integer
      example:
        Deleted: 3

paths:
  /domo/datastores/v1/collections/{collectionName}/documents:
    post:
      x-excluded: true
      summary: Create Document (v1)
      description: Creates a single document in a collection.
      tags:
      - AppDB API
      parameters:
        - name: collectionName
          in: path
          required: true
          description: The name given to the collection in the manifest
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentCreate'
            example:
              content:
                name: "Harry Potter"
                house: "Gryffindor"
                wand:
                  wood: "holly"
                  core: "phoenix feather"
                  length: 11
                courses:
                  - "Defense Against the Dark Arts"
                  - "Potions"
                  - "Transfiguration"
      x-codeSamples:
        - lang: JavaScript
          label: domo.js
          source: |-
            const collectionName = 'Students';

            domo.post(`/domo/datastores/v1/collections/${collectionName}/documents`, {
              content: {
                name: 'Harry Potter',
                house: 'Gryffindor',
                wand: { wood: 'holly', core: 'phoenix feather', length: 11 },
                courses: ['Defense Against the Dark Arts', 'Potions', 'Transfiguration'],
                enrolledOn: '1991-09-01',
                lastDetention: '1992-05-26T20:00:00Z'
              }
            }).then(doc => console.log(doc));
        - &stub_curl
          lang: cURL
          label: cURL
          source: |-
            # This API is only available inside a Domo app.
            # Use the JavaScript (domo.js) tab for the correct usage.
        - &stub_python
          lang: Python
          label: Python
          source: |-
            # This API is only available inside a Domo app.
            # Use the JavaScript (domo.js) tab for the correct usage.
        - &stub_php
          lang: PHP
          label: PHP
          source: |-
            // This API is only available inside a Domo app.
            // Use the JavaScript (domo.js) tab for the correct usage.
        - &stub_go
          lang: Go
          label: Go
          source: |-
            // This API is only available inside a Domo app.
            // Use the JavaScript (domo.js) tab for the correct usage.
        - &stub_java
          lang: Java
          label: Java
          source: |-
            // This API is only available inside a Domo app.
            // Use the JavaScript (domo.js) tab for the correct usage.
        - &stub_ruby
          lang: Ruby
          label: Ruby
          source: |-
            # This API is only available inside a Domo app.
            # Use the JavaScript (domo.js) tab for the correct usage.
      responses:
        '200':
          description: Document created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
              example:
                id: "402778f6-bc8d-4aa5-a581-e08e3fc98c05"
                datastoreId: "daee775a-3be4-410d-ba20-bb0d94ce51cb"
                collectionId: "2148c830-14c2-478f-bb14-5c3019de46b4"
                syncRequired: true
                owner: 540824222
                createdOn: "2026-07-31T23:09:34.542Z"
                updatedOn: "2026-07-31T23:09:34.542Z"
                updatedBy: 540824222
                content:
                  name: "Harry Potter"
                  house: "Gryffindor"
                  wand:
                    wood: "holly"
                    core: "phoenix feather"
                    length: 11
                  courses:
                    - "Defense Against the Dark Arts"
                    - "Potions"
                    - "Transfiguration"
                  enrolledOn: "1991-09-01"
                  lastDetention: "1994-06-08T20:00:00Z"

    get:
      x-excluded: true
      summary: List Documents (v1)
      description: Lists all documents from a given collection. There is an upper limit of 10,000 documents per request.
      tags:
      - AppDB API
      parameters:
        - name: collectionName
          in: path
          required: true
          description: The name given to the collection in the manifest
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of documents to return
          schema:
            type: integer
            default: 10000
        - name: offset
          in: query
          description: Number of documents to skip
          schema:
            type: integer
            default: 0
      x-codeSamples:
        - lang: JavaScript
          label: domo.js
          source: |-
            const collectionName = 'YourCollection';

            domo.get(`/domo/datastores/v1/collections/${collectionName}/documents`)
              .then(docs => console.log(docs));
        - *stub_curl
        - *stub_python
        - *stub_php
        - *stub_go
        - *stub_java
        - *stub_ruby
      responses:
        '200':
          description: Array of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
              example:
                - id: "402778f6-bc8d-4aa5-a581-e08e3fc98c05"
                  datastoreId: "daee775a-3be4-410d-ba20-bb0d94ce51cb"
