  # ========= Collection Endpoints =========

  /domo/datastores/v1/collections:
    post:
      summary: Create Collection
      description: |
        To create a Collection programmatically, provide as the body of the request the same JSON value that you would have provided in your manifest for a Collection when creating a custom app. Once created, the Collection can be retrieved by the name you provided as usual.

        Setting `syncEnabled: true` causes the Collection's documents to be converted into rows in a Domo DataSet every 15 minutes. The `schema` you define controls which fields appear as DataSet columns — only the listed properties are synced. If you plan to use sync, note the following:

        <Note>
        **Date formatting:** Documents containing `DATE` or `DATETIME` data must use the format `YYYY-MM-DD` or `YYYY-MM-DDTHH:MM:SSZ` to sync correctly.
        </Note>

        <Warning>
        **Only top-level fields can be synced.** Column names must be **top-level keys** in the document's `content` object; dot notation does not traverse nested objects during sync. To include a nested object, use the top-level key name (e.g., `wand`) — the synced value will be the JSON string representation of that object (e.g., `{"wood":"holly","core":"phoenix feather","length":11}`).
        </Warning>

        <Warning>
        **Incorrect schema types prevent DataSet creation.** The accepted column types are `STRING` · `LONG` · `DECIMAL` · `DOUBLE` · `DATE` · `DATETIME`. If your AppDB DataSet doesn't appear after 15 minutes, verify your schema uses only these values — common mistakes include `NUMBER` or `INTEGER`.
        </Warning>

        <Warning>
        **Collections won't sync if the collection owner lacks permissions on the target DataSet.** If that user is removed from Domo, syncing stops. The new owner must have both Collection ownership and Admin Permissions.
        </Warning>
      tags:
      - AppDB API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionCreate'
            example:
              name: "Students"
              schema:
                columns:
                  - name: "name"
                    type: "STRING"
                  - name: "house"
                    type: "STRING"
                  - name: "enrolledOn"
                    type: "DATE"
                  - name: "lastDetention"
                    type: "DATETIME"
              syncEnabled: true
      x-codeSamples:
        - lang: JavaScript
          label: domo.js
          source: |-
            domo.post('/domo/datastores/v1/collections', {
              name: 'Students',
              schema: {
                columns: [
                  { name: 'name', type: 'STRING' },
                  { name: 'house', type: 'STRING' },
                  { name: 'enrolledOn', type: 'DATE' },
                  { name: 'lastDetention', type: 'DATETIME' }
                ]
              },
              syncEnabled: true
            }).then(collection => console.log(collection));
        - *stub_curl
        - *stub_python
        - *stub_php
        - *stub_go
        - *stub_java
        - *stub_ruby
      responses:
        '200':
          description: Collection created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
              example:
                id: "757a1a2a-8d97-4c7e-875d-1bb5909df783"
                datastoreId: "a7363c9d-77ad-4ffa-8926-8295c8464f51"
                defaultPermissions: null
                requiredAuthorities: null
                owner: 540824222
                name: "Students"
                datasourceId: null
                schema:
                  columns:
                    - type: "STRING"
                      name: "name"
                    - type: "STRING"
                      name: "house"
                    - type: "DATE"
                      name: "enrolledOn"
                    - type: "DATETIME"
                      name: "lastDetention"
                filters: null
                syncEnabled: true
                syncRequired: true
                fullReplaceRequired: false
                lastSync: null
                createdOn: "2026-08-01T00:10:52.952Z"
                updatedOn: "2026-08-01T00:10:52.952Z"
                updatedBy: 540824222
        '400':
          description: "`syncEnabled: true` was passed without a `schema`."

    get:
      summary: List Collections
      description: Retrieves a list of the existing Collections for your application.
      tags:
      - AppDB API
      x-codeSamples:
        - lang: JavaScript
          label: domo.js
          source: |-
            domo.get('/domo/datastores/v1/collections')
              .then(collections => console.log(collections));
        - *stub_curl
        - *stub_python
        - *stub_php
        - *stub_go
        - *stub_java
        - *stub_ruby
      responses:
        '200':
          description: Array of collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Collection'
              example:
                - id: "a3aaeeed-5210-4048-9ff0-d88fa0de4eda"
                  datastoreId: "5565fecc-a852-4799-83bf-f9423c0f7687"
                  defaultPermissions: null
                  requiredAuthorities: null
                  owner: 870010733
                  name: "Students"
                  datasourceId: null
                  schema:
                    columns:
                      - type: "STRING"
                        name: "name"
                      - type: "STRING"
                        name: "house"
                  filters: null
                  syncEnabled: false
                  syncRequired: false
                  fullReplaceRequired: false
                  lastSync: null
                  createdOn: "2026-06-25T01:26:34.744Z"
                  updatedOn: "2026-06-25T01:26:34.744Z"
                  updatedBy: 870010733

  /domo/datastores/v1/collections/{collectionName}:
    put:
      summary: Update Collection
      description: |
        You can update the schema and other properties of a collection. To see their current value, use the List Collections endpoint.
        
        <Danger>
        **Update Manifest Instead Of Collection**

        If you manually override the properties of a Collection that exists in your manifest, then any time an app Card is saved, the Card will revert back to the manifest definition of that Collection. It is best practice to only update Collections that you have created manually. Otherwise, to update a Collection, simply update the manifest.
        </Danger>

        <Note>
        After updating the manifest and re-publishing your app design, you must **edit the installed app and re-save it** for manifest changes to take effect.
        </Note>

        If the collection has `syncEnabled`, updating the `schema` changes which fields are synced to the linked Domo DataSet. Note the following when modifying a synced collection's schema:

        <Note>
        **Date formatting:** Documents containing `DATE` or `DATETIME` data must use the format `YYYY-MM-DD` or `YYYY-MM-DDTHH:MM:SSZ` to sync correctly.
        </Note>

        <Warning>
        **Only top-level fields can be synced.** Column names must be **top-level keys** in the document's `content` object; dot notation does not traverse nested objects during sync. To include a nested object, use the top-level key name (e.g., `wand`) — the synced value will be the JSON string representation of that object (e.g., `{"wood":"holly","core":"phoenix feather","length":11}`).
        </Warning>

        <Warning>
        **Incorrect schema types prevent DataSet creation.** The accepted column types are `STRING` · `LONG` · `DECIMAL` · `DOUBLE` · `DATE` · `DATETIME`. If your AppDB DataSet doesn't appear after 15 minutes, verify your schema uses only these values — common mistakes include `NUMBER` or `INTEGER`.
        </Warning>
      tags:
      - AppDB API
      parameters:
        - name: collectionName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: "Rename the collection. Note: renaming only changes the stored name — your app's `collectionsMapping` still routes calls using the original name from the manifest. The app will continue to work, but the name shown in AppDB Admin and returned by List Collections will reflect the new name."
                schema:
                  $ref: '#/components/schemas/Schema'
                syncEnabled:
                  type: boolean
            example:
              schema:
                columns:
                  - type: "STRING"
                    name: "name"
                  - type: "STRING"
                    name: "house"
                  - type: "DATE"
                    name: "enrolledOn"
                  - type: "DATETIME"
                    name: "lastDetention"
              syncEnabled: true
      x-codeSamples:
        - lang: JavaScript
          label: domo.js
          source: |-
            const collectionName = 'YourCollection';

            domo.put(`/domo/datastores/v1/collections/${collectionName}`, {
              schema: {
                columns: [
                  { name: 'name', type: 'STRING' },
                  { name: 'house', type: 'STRING' },
                  { name: 'enrolledOn', type: 'DATE' },
                  { name: 'lastDetention', type: 'DATETIME' }
                ]
              },
              syncEnabled: true
            }).then(collection => console.log(collection));
        - *stub_curl
        - *stub_python
        - *stub_php
        - *stub_go
        - *stub_java
        - *stub_ruby
      responses:
        '200':
          description: Collection updated successfully. Returns the full updated collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
              example:
                id: "a3aaeeed-5210-4048-9ff0-d88fa0de4eda"
                datastoreId: "5565fecc-a852-4799-83bf-f9423c0f7687"
                defaultPermissions: null
                requiredAuthorities: null
                owner: 870010733
                name: "Students"
                datasourceId: null
                schema:
                  columns:
                    - type: "STRING"
                      name: "name"
                    - type: "STRING"
                      name: "house"
                    - type: "DATE"
                      name: "enrolledOn"
                    - type: "DATETIME"
                      name: "lastDetention"
                filters: null
                syncEnabled: true
                syncRequired: true
                fullReplaceRequired: true
                lastSync: null
                createdOn: "2026-06-25T01:26:34.744Z"
                updatedOn: "2026-06-25T01:26:41.145Z"
                updatedBy: 870010733

    delete:
      summary: Delete Collection
      description: "Programmatically deletes a Collection.\n\n<Danger>\n**Warning**\n\nThis is destructive and cannot be reversed.\n</Danger>"
      tags:
      - AppDB API
      parameters:
        - name: collectionName
          in: path
          required: true
          schema:
            type: string
            description: The name of the collection provided when the collection was created
      x-codeSamples:
        - lang: JavaScript
          label: domo.js
          source: |-
            const collectionName = 'YourCollection';

            domo.delete(`/domo/datastores/v1/collections/${collectionName}`)
              .then(() => console.log('collection deleted'));
        - *stub_curl
        - *stub_python
        - *stub_php
        - *stub_go
        - *stub_java
        - *stub_ruby
      responses:
        '200':
          description: Collection deleted successfully. No response body is returned.

  /domo/datastores/v1/export:
    post:
      summary: Manually Export Collections
      description: |
        Manually trigger an asynchronous export (sync) of this card's collections to
        their linked Domo DataSets. Only collections that have a linked DataSet and
        pending changes are synced. By default, only the collections in this card's own
        datastore are exported. Set `includeRelatedCollections=true` to additionally
        export the related collections this card instance is mapped to through the app's
        design manifest (its `collectionsMapping`), such as collections shared from
        another instance. Returns an empty body on success.

        <Warning>
        **Collections won't sync if the collection owner lacks permissions on the target DataSet.** If that user is removed from Domo, syncing stops. The new owner must have both Collection ownership and Admin Permissions.
        </Warning>
      tags:
      - AppDB API
      parameters:
        - name: includeRelatedCollections
          in: query
          description: >-
            When `true`, exports this card's own datastore collections **plus** the related
            collections the card instance is mapped to through the app design. When `false`
            (default), exports only the card's own datastore collections.
          schema:
            type: boolean
            default: false
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example: {}
      x-codeSamples:
        - lang: JavaScript
          label: domo.js
          source: |-
            // Export this card's own collections
            domo.post('/domo/datastores/v1/export')
              .then(() => console.log('export started'));

            // Also export related collections (collectionsMapping)
            domo.post('/domo/datastores/v1/export?includeRelatedCollections=true')
              .then(() => console.log('export started'));
        - *stub_curl
        - *stub_python
        - *stub_php
        - *stub_go
        - *stub_java
        - *stub_ruby
      responses:
        '200':
          description: Export accepted and running asynchronously. No response body is returned.
        '423':
          description: Export already in progress (LOCKED). Retry once the current export completes.

  /domo/datastores/v1/collections/{collectionName}/permission/{entity}/{entityId}:
    put:
      summary: Modify Collection Permissions
      description: |
        Modify the permissions for a user, group, or app instance on a collection.

        **Entity types**

        | `entity` path param | `entityId` value |
        | ------------------- | ---------------- |
        | `USER`              | Domo user ID |
        | `GROUP`             | Domo group ID |
        | `RYUU_APP`          | App instance ID (first UUID in the iframe URL) |

        **Available permissions**

        | Permission       | Grants |
        | ---------------- | ------ |
        | `admin`          | All permissions to the collection and its documents |
        | `write`          | Update the collection's properties |
        | `read`           | Read the collection's properties |
        | `share`          | Add or remove permissions this entity already holds |
        | `delete`         | Delete the collection or its documents |
        | `create_content` | Create documents in the collection |
        | `update_content` | Update documents in the collection |
        | `read_content`   | Read documents in the collection |
        | `delete_content` | Delete documents from the collection |

        Removing all entity permissions leaves only users with the **Manage AppDB** grant with access.
      tags:
      - AppDB API
      parameters:
        - name: collectionName
          in: path
          required: true
          schema:
            type: string
        - name: entity
          in: path
          required: true
          description: Type of entity
          schema:
            type: string
            enum: [USER, GROUP, RYUU_APP]
        - name: entityId
          in: path
          required: true
          description: ID of the user, group, or app instance
          schema:
            type: string
        - name: permissions
          in: query
          required: true
          description: Comma-separated list of permissions
          schema:
            type: string
          example: "read,create_content,update_content,read_content"
      x-codeSamples:
        - lang: JavaScript
          label: domo.js
          source: |-
            const collectionName = 'YourCollection';
            const entity = 'RYUU_APP'; // USER, GROUP, or RYUU_APP
            const entityId = 'your-entity-id';
            const permissions = 'read,create_content,update_content,read_content';

            domo.put(
              `/domo/datastores/v1/collections/${collectionName}/permission/${entity}/${entityId}?permissions=${permissions}`
            ).then(() => console.log('permissions updated'));
        - *stub_curl
        - *stub_python
        - *stub_php
        - *stub_go
        - *stub_java
        - *stub_ruby
      responses:
        '200':
          description: Permissions updated successfully. No response body is returned.

    delete:
      summary: Delete Permissions
      description: You can remove all permissions for an entity using the endpoint below. If all entities' permissions are removed, then only users with the Manage AppDB grant will still have access.
      tags:
      - AppDB API
      parameters:
        - name: collectionName
          in: path
          required: true
          schema:
            type: string
        - name: entity
          in: path
          required: true
          schema:
            type: string
            enum: [USER, GROUP, RYUU_APP]
        - name: entityId
          in: path
          required: true
          schema:
            type: string
      x-codeSamples:
        - lang: JavaScript
          label: domo.js
          source: |-
            const collectionName = 'YourCollection';
            const entity = 'RYUU_APP'; // USER, GROUP, or RYUU_APP
            const entityId = 'your-entity-id';

            domo.delete(
              `/domo/datastores/v1/collections/${collectionName}/permission/${entity}/${entityId}`
            ).then(() => console.log('permissions removed'));
        - *stub_curl
        - *stub_python
        - *stub_php
        - *stub_go
        - *stub_java
        - *stub_ruby
      responses:
        '200':
          description: Permissions removed successfully. No response body is returned.
