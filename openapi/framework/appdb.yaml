          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
              example:
                id: "757a1a2a-8d97-4c7e-875d-1bb5909df783"
                datastoreId: "a7363c9d-77ad-4ffa-8926-8295c8464f51"
