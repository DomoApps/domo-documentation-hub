      parameters:
        - name: collectionName
          in: path
          required: true
          schema:
            type: string
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      x-codeSamples:
        - lang: JavaScript
          label: domo.js
          source: |-
            const collectionName = 'YourCollection';
            const documentId = 'your-document-id';

            domo.delete(`/domo/datastores/v1/collections/${collectionName}/documents/${documentId}`)
              .then(() => console.log('deleted'));
        - *stub_curl
        - *stub_python
        - *stub_php
        - *stub_go
        - *stub_java
        - *stub_ruby
      responses:
        '200':
          description: Document deleted successfully. No response body is returned.
        '404':
          description: Document not found

  /domo/datastores/v1/collections/{collectionName}/documents/query:
    post:
      summary: Query Documents
      description: |
        Query documents using MongoDB query syntax.

        **Supported operators**

        All MongoDB query predicates supported in a `find()` call are available, including comparison, logical, array, data type, bitwise, `$expr`, `$jsonSchema`, `$regex`, `$geoWithin`, and `$geoIntersects`. The following operators are **not** supported:

        - `$where` — JavaScript evaluation is disabled server-side.
        - `$near` and `$nearSphere` — geospatial proximity searches require an index that AppDB collections do not have.

        See the [MongoDB query predicate documentation](https://www.mongodb.com/docs/manual/reference/mql/query-predicates/) for the full operator list.

        **Querying by date**

        Use [MongoDB Extended JSON v2](https://www.mongodb.com/docs/manual/reference/mongodb-extended-json/#bson.Date) `$date` to compare against a date value:

        ```json
        {
          "createdOn": {
            "$lte": { "$date": "2020-05-12T00:00:00.000Z" }
          }
        }
        ```

        **Aggregation query parameters**

        Field names use dot notation; fields inside `content` must be prefixed with `content.` (e.g., `content.campaignName`). Top-level fields like `owner` and `createdOn` can be referenced directly.

        **Aggregation examples**

        The following examples use this sample movie collection:
        ```json
        [
          {
            "content": {
              "title": "Inception", "genre": "sci-fi",
              "year": 2010, "rating": 8.8,
              "tags": ["mind-bending", "action"]
            }
          },
          {
            "content": {
              "title": "Interstellar", "genre": "sci-fi",
              "year": 2014, "rating": 8.6,
              "tags": ["mind-bending", "emotional"]
            }
          },
          {
            "content": {
              "title": "The Notebook", "genre": "romance",
              "year": 2004, "rating": 7.9,
              "tags": ["romantic", "drama"]
            }
          },
          {
            "content": {
              "title": "Titanic", "genre": "romance",
              "year": 1997, "rating": 7.8,
              "tags": ["romantic", "drama", "action"]
            }
          },
          {
            "content": {
              "title": "The Avengers", "genre": "action",
              "year": 2012, "rating": 8.0,
              "tags": ["action", "superhero"]
            }
          }
        ]
        ```

        **Average rating per genre for movies released since 2010**
        ```
        ?groupby=content.genre&avg=content.rating avgRating&orderby=avgRating descending
        ```
        Body:
        ```json
        {"content.year": {"$gte": 2010}}
        ```
        Response:
        ```json
        [
          {"_id": "sci-fi", "avgRating": 8.7},
          {"_id": "action", "avgRating": 8.0}
        ]
        ```

        **Movie count per genre**
        ```
        ?groupby=content.genre&count=count
        ```
        Body: `{}`
        ```json
        [
          {"_id": "sci-fi",  "count": 2},
          {"_id": "romance", "count": 2},
          {"_id": "action",  "count": 1}
        ]
        ```

        **Tag frequency across all movies**

        `unwind` produces one document per tag value before grouping, so a movie with `["action", "romantic"]` counts once toward each group.
        ```
        ?unwind=content.tags&groupby=content.tags&count=count&orderby=count descending
        ```
        Body: `{}`
        ```json
        [
          {"_id": "action",       "count": 3},
          {"_id": "romantic",     "count": 2},
          {"_id": "drama",        "count": 2},
          {"_id": "mind-bending", "count": 2},
          {"_id": "superhero",    "count": 1},
          {"_id": "emotional",    "count": 1}
        ]
        ```

        **Rating statistics by genre**

        ```
        ?groupby=content.genre&sum=content.rating totalRating&min=content.rating minRating&max=content.rating maxRating&orderby=maxRating descending
        ```
        Body: `{}`
        ```json
        [
          {"_id": "sci-fi",  "totalRating": 17.4, "minRating": 8.6, "maxRating": 8.8},
          {"_id": "action",  "totalRating": 8.0,  "minRating": 8.0, "maxRating": 8.0},
          {"_id": "romance", "totalRating": 15.7, "minRating": 7.8, "maxRating": 7.9}
        ]
        ```

        When grouping by multiple fields, `_id` is an object instead of a scalar — e.g., `{"_id": {"genre": "sci-fi", "year": 2010}}`. Aggregation values are top-level keys using their configured aliases.
      tags:
      - AppDB API
      parameters:
        - name: collectionName
          in: path
          required: true
          schema:
            type: string
            description: The name given to the collection in the manifest
        - name: groupby
          in: query
          description: Comma-separated list of properties to group by
          schema:
            type: string
          example: "content.campaignName,content.month"
        - name: count
          in: query
          description: Alias for count aggregation
          schema:
            type: string
        - name: avg
          in: query
          description: "`property alias` pairs, comma-separated — computes the average of each property. Alias is used as the key in the response."
          schema:
            type: string
          example: "content.clicks avgClicks,content.impressions avgImps"
        - name: min
          in: query
          description: "`property alias` pairs, comma-separated — computes the minimum of each property."
          schema:
            type: string
          example: "content.clicks minClicks,content.impressions minImps"
        - name: max
          in: query
          description: "`property alias` pairs, comma-separated — computes the maximum of each property."
          schema:
            type: string
          example: "content.clicks maxClicks,content.impressions maxImps"
        - name: sum
          in: query
          description: "`property alias` pairs, comma-separated — computes the sum of each property."
          schema:
            type: string
          example: "content.clicks sumClicks,content.impressions sumImps"
        - name: unwind
          in: query
          description: "Comma-separated list of properties to unwind (deconstructs an array field, producing one document per element). Must be combined with at least one of `count`, `groupby`, `avg`, `min`, `max`, or `sum`."
          schema:
            type: string
        - name: orderby
          in: query
          description: "Field name or aggregation alias to sort by, followed by `ascending` or `descending`. Without aggregation, accepts field names in dot notation; with aggregation, accepts aliases defined by other parameters."
          schema:
            type: string
          example: "sumClicks descending"
        - name: limit
          in: query
          description: Maximum number of documents to return
          schema:
            type: integer
            default: 10000
        - name: offset
          in: query
          description: Number of documents to skip
          schema:
            type: integer
            default: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MongoQuery'
            examples:
              simpleQuery:
                summary: Simple query example
                value:
                  $or:
                    - content.comments:
                        $regex: "happy"
                    - content.username:
                        $ne: "Eeyore"
              dateQuery:
                summary: Query with date filter
                value:
                  createdOn:
                    $lte:
                      $date: "2020-05-12T00:00:00.000Z"
      x-codeSamples:
        - lang: JavaScript
          label: domo.js
          source: |-
            const collectionName = 'YourCollection';

            // Simple filter
            domo.post(`/domo/datastores/v1/collections/${collectionName}/documents/query`, {
              $or: [
                { 'content.comments': { $regex: 'happy' } },
                { 'content.username': { $ne: 'Eeyore' } }
              ]
            }).then(docs => console.log(docs));

            // With aggregation (query params)
            domo.post(
              `/domo/datastores/v1/collections/${collectionName}/documents/query?groupby=content.band&count=count`,
              {}
            ).then(results => console.log(results));
        - *stub_curl
        - *stub_python
        - *stub_php
        - *stub_go
        - *stub_java
        - *stub_ruby
      responses:
        '200':
          description: Array of matching documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
              example:
                - id: "c023b254-647e-4839-b74b-b050d4c17447"
                  datastoreId: "5565fecc-a852-4799-83bf-f9423c0f7687"
                  collectionId: "a3aaeeed-5210-4048-9ff0-d88fa0de4eda"
                  syncRequired: true
                  owner: 870010733
                  createdOn: "2026-06-25T01:33:56.332Z"
                  updatedOn: "2026-06-25T01:33:58.316Z"
                  updatedBy: 870010733
                  content:
                    username: "Bill S. Preston, Esquire"
                    score: 99
                    band: "Wyld Stallyns"

  /domo/datastores/v1/collections/{collectionName}/documents/update:
    put:
      summary: Partially Update Documents
      description: |
        Partially updates documents matching a query using MongoDB update operators.

        **Supported operators**

        `$currentDate` · `$inc` · `$min` · `$max` · `$mul` · `$rename` · `$set` · `$unset` · `$addToSet` · `$pop` · `$pull` · `$pullAll` · `$push`

        **Supported modifiers**

        `$each` · `$position` · `$slice` · `$sort`

        <Note>
          `$setOnInsert` has no effect — partial updates do not perform upserts.
        </Note>

        See the [MongoDB update operator documentation](https://www.mongodb.com/docs/manual/reference/mql/update/) for full semantics.
      tags:
      - AppDB API
      parameters:
        - name: collectionName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartialUpdateRequest'
