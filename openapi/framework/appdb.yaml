              example:
                status: 403
                statusReason: "status 403 reading DocumentsResourceClient#updateDocument(UUID,UUID,DocumentDefinition)"
                toe: "BU22GXWMDI-ILY50-5YX28"
        '404':
          description: "Collection not found. Verify the collection name matches your manifest and that the collection has been created or correctly wired."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 404
                statusReason: "DA0088: Invalid collection name: students"
                toe: "C7Z7W7ILTW-D2P1Y-9QKHK"

