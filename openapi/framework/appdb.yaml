  /domo/datastores/v1/collections/{collectionName}/documents/{documentId}:
    get:
      summary: Get Document
      description: Retrieves a single document from a collection
      tags:
      - AppDB API
      parameters:
        - name: collectionName
          in: path
          required: true
          schema:
            type: string
        - name: documentId
          in: path
          required: true
          description: The UUID of the document
          schema:
            type: string
            format: uuid
      x-codeSamples:
        - lang: JavaScript
          label: domo.js
          source: |-
            const collectionName = 'YourCollection';
            const documentId = 'your-document-id';

            domo.get(`/domo/datastores/v1/collections/${collectionName}/documents/${documentId}`)
              .then(doc => console.log(doc));
        - *stub_curl
        - *stub_python
        - *stub_php
        - *stub_go
        - *stub_java
        - *stub_ruby
      responses:
        '200':
          description: Document retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
              example:
                id: "c023b254-647e-4839-b74b-b050d4c17447"
                datastoreId: "5565fecc-a852-4799-83bf-f9423c0f7687"
                collectionId: "a3aaeeed-5210-4048-9ff0-d88fa0de4eda"
                syncRequired: true
                owner: 870010733
                createdOn: "2026-06-25T01:33:56.332Z"
                updatedOn: "2026-06-25T01:33:56.332Z"
                updatedBy: 870010733
                content:
                  username: "Bill S. Preston, Esquire"
                  score: 42
        '404':
          description: Document not found

    put:
      summary: Update Document
      description: Updates an existing document in a collection
      tags:
      - AppDB API
      parameters:
        - name: collectionName
          in: path
          required: true
          schema:
            type: string
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUpdate'
            example:
              content:
                username: "Bill S. Preston, Esquire"
                Band: "Wyld Stallyns"
      x-codeSamples:
        - lang: JavaScript
          label: domo.js
          source: |-
            const collectionName = 'YourCollection';
            const documentId = 'your-document-id';

            domo.put(`/domo/datastores/v1/collections/${collectionName}/documents/${documentId}`, {
              content: { username: 'Bill S. Preston, Esquire', Band: 'Wyld Stallyns' }
            }).then(doc => console.log(doc));
        - *stub_curl
        - *stub_python
        - *stub_php
        - *stub_go
        - *stub_java
        - *stub_ruby
      responses:
        '200':
          description: Document updated successfully. Returns the full updated document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
              example:
                id: "c023b254-647e-4839-b74b-b050d4c17447"
                datastoreId: "5565fecc-a852-4799-83bf-f9423c0f7687"
                collectionId: "a3aaeeed-5210-4048-9ff0-d88fa0de4eda"
                syncRequired: true
                owner: 870010733
                createdOn: "2026-06-25T01:33:56.332Z"
                updatedOn: "2026-06-25T01:33:58.316Z"
