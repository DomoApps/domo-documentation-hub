                status: 400
                statusReason: "Bad Request"
                toe: "APS9BQQ3SQ-HJJ5D-9MRP6"
        '403':
          description: "Forbidden. The user does not have the UPDATE_CONTENT permission on this collection."
          content:
            application/json:
              schema:
