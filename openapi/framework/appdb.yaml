                statusReason: "status 403 reading CollectionsResourceClient#revokeCollectionPermission(UUID,String,String); content:\n{\"status\":403,\"toe\":\"66W18AJRO2-2RSJP-MO2J4\"}"
                toe: "66W18AJRO2-2RSJP-MO2J4"
        '404':
