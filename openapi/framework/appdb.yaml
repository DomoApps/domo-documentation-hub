openapi: 3.0.0
info:
  title: Domo AppDB API
  version: v1
  description: |
    AppDB API for storing arbitrary JSON documents similar to a NoSQL database. This enables storing state within your DomoApp
    with optional syncing to Domo DataSets.

    Three layers provide data storage:
    - **Datastores**: Analogous to a database. A CustomApp has a single datastore created automatically.
    - **Collections**: Analogous to a collection in NoSQL or table in relational databases.
    - **Documents**: Analogous to documents in NoSQL or table rows in relational databases.

servers:
  - url: 'https://{instance}.domo.com'
    description: Domo Instance
    variables:
      instance:
        default: example
        description: Your Domo instance name

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: A human-readable error message

    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the document
        owner:
          type: integer
          format: int64
        datastoreId:
          type: string
          format: uuid
        collectionId:
          type: string
          format: uuid
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
        updatedBy:
          type: integer
          format: int64
        content:
          type: object
          additionalProperties: true
          description: The actual document content
        syncRequired:
          type: boolean
      example:
        id: "c023b254-647e-4839-b74b-b050d4c17447"
        datastoreId: "5565fecc-a852-4799-83bf-f9423c0f7687"
        collectionId: "a3aaeeed-5210-4048-9ff0-d88fa0de4eda"
        syncRequired: true
        owner: 870010733
        createdOn: "2026-06-25T01:33:56.332Z"
        updatedOn: "2026-06-25T01:33:56.332Z"
        updatedBy: 870010733
        content:
          username: "Bill S. Preston, Esquire"
          score: 42

    DocumentCreate:
      type: object
      required:
        - content
      properties:
        content:
          type: object
          additionalProperties: true
          description: The document content matching collection schema

    DocumentUpdate:
      type: object
      required:
        - content
      properties:
        content:
          type: object
          additionalProperties: true
          description: Updated document content

    Collection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        owner:
          type: integer
          format: int64
        datastoreId:
          type: string
          format: uuid
        name:
          type: string
        datasourceId:
          type: string
          format: uuid
          nullable: true
        defaultPermissions:
          nullable: true
          description: Default permissions for the collection. Null when not configured.
        requiredAuthorities:
          nullable: true
          description: Required authorities for access. Null when not configured.
        filters:
          nullable: true
          description: Collection-level filters. Null when not configured.
        schema:
          $ref: '#/components/schemas/Schema'
        syncEnabled:
          type: boolean
        syncRequired:
          type: boolean
        fullReplaceRequired:
          type: boolean
        lastSync:
          type: string
          format: date-time
          nullable: true
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
        updatedBy:
          type: integer
          format: int64
      example:
        id: "a3aaeeed-5210-4048-9ff0-d88fa0de4eda"
        datastoreId: "5565fecc-a852-4799-83bf-f9423c0f7687"
        defaultPermissions: null
        requiredAuthorities: null
        owner: 870010733
        name: "Users"
        datasourceId: null
        schema:
          columns:
            - type: "STRING"
              name: "username"
            - type: "STRING"
              name: "band"
        filters: null
        syncEnabled: false
        syncRequired: false
        fullReplaceRequired: false
        lastSync: null
        createdOn: "2026-06-25T01:26:34.744Z"
        updatedOn: "2026-06-25T01:26:34.744Z"
        updatedBy: 870010733

    CollectionCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the collection
        schema:
          $ref: '#/components/schemas/Schema'
        syncEnabled:
          type: boolean
          default: false

    Schema:
      type: object
      properties:
        columns:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
                enum: [STRING, LONG, DECIMAL, DOUBLE, DATE, DATETIME]
              visible:
                type: boolean
                default: true

    MongoQuery:
      type: object
      additionalProperties: true
      description: MongoDB query object
      example:
        $or:
          - content.comments:
              $regex: "happy"
          - content.username:
              $ne: "Eeyore"

    PartialUpdateRequest:
      type: object
      required:
        - query
        - operation
      properties:
        query:
          type: object
          additionalProperties: true
          description: MongoDB query to match documents
        operation:
          type: object
          additionalProperties: true
          description: MongoDB update operation

    BulkCreateResponse:
      type: object
      properties:
        Created:
          type: integer
      example:
        Created: 2

    BulkUpsertResponse:
      type: object
      properties:
        Updated:
          type: integer
        Created:
          type: integer
      example:
        Updated: 1
        Created: 1

    BulkDeleteResponse:
      type: object
      properties:
        Deleted:
          type: integer
      example:
        Deleted: 3

paths:
  /domo/datastores/v1/collections/{collectionName}/documents:
    post:
      summary: Create Document
      description: Creates a single document in a collection
      tags:
      - AppDB API
      parameters:
        - name: collectionName
          in: path
          required: true
          description: The name given to the collection in the manifest
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentCreate'
            example:
              content:
                username: "Bill S. Preston, Esquire"
      x-codeSamples:
        - lang: JavaScript
          label: domo.js
          source: |-
            const collectionName = 'YourCollection';

            domo.post(`/domo/datastores/v1/collections/${collectionName}/documents`, {
              content: { username: 'Bill S. Preston, Esquire' }
            }).then(doc => console.log(doc));
