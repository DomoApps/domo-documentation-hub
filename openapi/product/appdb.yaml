      description: "Triggers a sync of all syncEnabled collections in the datastore to their linked Domo DataSets. Each collection must have `syncEnabled: true` to be synced. If a collection does not yet have a `datasourceId`, one is created automatically on first sync. Optionally pass a list of collection IDs from **other** datastores in the request body to sync those collections in the same operation — these are typically shared collections declared with a fixed UUID in an app design's `collectionsMapping`, which live outside the primary datastore and are shared across app instances."
      tags:
        - App DB API (Product)
      parameters:
        - name: datastoreId
          in: path
