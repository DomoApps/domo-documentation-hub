  /api/datastores/v2/collections/{collectionId}/documents/bulk:
    post:
      summary: Bulk Create Documents
      description: "Add multiple documents to a collection in a single request. Each document is limited to 2 MB."
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DocumentContent'
            example:
              - content: { "campaignName": "Q2 Campaign", "region": "West", "status": "Active" }
              - content: { "campaignName": "Red Campaign", "region": "East", "status": "Inactive" }
      responses:
        '200':
          description: Returns the number of created documents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Created:
                    type: integer
                    description: Number of documents created.
              example:
                Created: 2

    put:
      summary: Bulk Upsert Documents
      description: "Insert or update multiple documents in a single request. Documents with a matching `id` are updated; documents without a matching `id` are created. Each document is limited to 2 MB."
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: Document ID to update. Omit to create a new document.
                  content:
                    type: object
                    additionalProperties: true
                    description: Arbitrary JSON content of the document.
            example:
              - id: "a8428d64-a01d-49b2-9144-ddeec001acf8"
                content: { "campaignName": "Q2 Campaign", "region": "West", "status": "Inactive" }
              - content: { "campaignName": "New Campaign", "region": "North", "status": "Active" }
      responses:
        '200':
          description: Returns the number of updated and created documents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Updated:
                    type: integer
                    description: Number of documents updated.
                  Created:
                    type: integer
                    description: Number of documents created.
              example:
                Updated: 1
                Created: 1

    delete:
      summary: Bulk Delete Documents
      description: "Remove multiple documents from a collection in a single request. IDs are passed as a comma-separated `ids` query parameter. For large batches, keep requests under approximately 800 UUIDs (~30 KB URL) to avoid URL length errors; split larger deletes across multiple requests."
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - name: ids
          in: query
          required: true
          description: A comma-separated list of document IDs.
          schema:
            type: string
          example: "id1,id2,id3"
      responses:
        '202':
          description: Accepted — returns the count of deleted documents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Deleted:
                    type: integer
                    description: Number of documents deleted.
              example:
                Deleted: 2

  /api/datastores/v2/collections/{collectionId}/documents/update:
    put:
      summary: Partially Update Documents
      description: |
        Perform partial updates on documents using MongoDB query and update operations.
        Returns the number of documents updated. Returns `0` if no documents matched — this is a successful response, not an error.
        `$setOnInsert` has no effect because AppDB partial updates do not perform upserts.

        **Supported update operators:** `currentDate`, `inc`, `min`, `max`, `mul`, `rename`, `set`, `unset`, `addToSet`, `pop`, `pull`, `pullAll`, `push`

        **Supported modifiers:** `each`, `position`, `slice`, `sort`

        See the [MongoDB Update Operators documentation](https://www.mongodb.com/docs/manual/reference/mql/update/) for details.
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, operation]
              properties:
                query:
                  type: object
                  additionalProperties: true
                  description: MongoDB query that identifies the documents to update.
                operation:
                  type: object
                  additionalProperties: true
                  description: MongoDB update operation to apply.
            examples:
              set-field:
                summary: Set a field on matching documents
                value:
                  query:
                    content.status: "Draft"
                  operation:
                    $set:
                      content.status: "Active"
              increment-field:
                summary: Increment a numeric field
                value:
                  query:
                    content.views:
                      $exists: true
                  operation:
                    $inc:
                      content.views: 1
      responses:
        '200':
          description: Returns the number of updated documents or properties.
          content:
            application/json:
              schema:
                type: integer
                example: 1

  /api/datastores/v2/collections/{collectionId}/download:
    get:
      summary: Download Documents
      description: >-
        Download documents in a collection as a JSON file (served with a
        `Content-Disposition: attachment` header). Each entry is a complete document object
        in the same shape accepted by Import Documents.

        **Hard limit: returns at most 100 documents.** If the collection has more than 100 documents,
        only the first 100 are returned with no error or warning. Use the List Documents endpoint with
        `limit`/`offset` pagination to retrieve larger collections.
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
      responses:
        '200':
          description: JSON array of the documents in the collection.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'

  /api/datastores/v2/collections/{collectionId}/documents/import:
    put:
      summary: Import Documents
      description: >-
        Bulk-import complete document objects into a collection — the counterpart to Download
        Documents. Each item must be a full document (including its `id`); documents are
        **upserted by `id`**, so the original `id`, `createdOn`, and `owner` are preserved.
        This is the format produced by Download Documents, which makes the two endpoints a
        copy/restore pair. To add brand-new documents from raw content instead, use Create
        Document. Existing documents not present in the payload are left untouched.
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Document'
            example:
              - id: "a8428d64-a01d-49b2-9144-ddeec001acf8"
                datastoreId: "39b88a97-8247-4c0d-ba1d-8ed78d1a6680"
                collectionId: "232e6d6c-46e9-49b6-a137-8933f0f05999"
                syncRequired: true
                owner: "870010733"
                createdBy: "870010733"
                createdOn: "2026-06-23T20:58:06.567Z"
                updatedOn: "2026-06-23T23:36:13.177Z"
                updatedBy: "870010733"
                content:
                  username: "bill"
                  email: "bill@example.com"
      responses:
        '200':
          description: >-
            Import completed. Returns counts of the operations performed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Updated:
                    type: integer
                    description: Number of existing documents that were updated.
                  Created:
                    type: integer
                    description: Number of documents created.
                  Upserted:
                    type: integer
                    description: Number of documents inserted via upsert (matched no existing document).
              example:
                Updated: 0
                Created: 0
                Upserted: 1

  /api/datastores/v1/collections/{collectionId}/documents/update:
    put:
      summary: Partially Update Documents (v1, Deprecated)
      deprecated: true
      description: |
        **Deprecated.** Use the v2 Partially Update Documents endpoint instead.

        Perform partial updates on documents using MongoDB query and update operations.
        Returns the number of documents updated. Returns `0` if no documents matched — this is a successful response, not an error.
        `$setOnInsert` has no effect because AppDB partial updates do not perform upserts.

        **Supported update operators:** `currentDate`, `inc`, `min`, `max`, `mul`, `rename`, `set`, `unset`, `addToSet`, `pop`, `pull`, `pullAll`, `push`

        **Supported modifiers:** `each`, `position`, `slice`, `sort`

        See the [MongoDB Update Operators documentation](https://www.mongodb.com/docs/manual/reference/mql/update/) for details.
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, operation]
              properties:
                query:
                  type: object
                  additionalProperties: true
                  description: MongoDB query that identifies the documents to update.
                operation:
                  type: object
                  additionalProperties: true
                  description: MongoDB update operation to apply.
            examples:
              set-field:
                summary: Set a field on matching documents
                value:
                  query:
                    content.status: "Draft"
                  operation:
                    $set:
                      content.status: "Active"
      responses:
        '200':
          description: Returns the number of updated documents or properties.
          content:
            application/json:
              schema:
                type: integer
                example: 1
