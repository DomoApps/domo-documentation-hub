          collections declared with a fixed UUID in an app design's `collectionsMapping`.
          Pass an empty array or omit the body entirely to sync only this datastore's
          own collections.
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uuid
            example: ["3f2504e0-4f89-11d3-9a0c-0305e82c3301"]
      responses:
        '200':
