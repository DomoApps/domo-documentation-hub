openapi: 3.0.0
info:
  title: App DB API
  version: v1
  description: |
    The App DB API allows developers to interact with AppDB, a NoSQL database 
    for storing arbitrary JSON documents. This API supports CRUD operations, 
    querying, and aggregation, enabling developers to manage data efficiently 
    within their Domo applications.
servers:
  - url: 'https://{instance}.domo.com'
    description: Domo Instance
    variables:
      instance:
        default: 'api'
        description: 'Your specific Domo instance name (e.g., mycompany)'
tags:
  - name: Documents
    description: Manage individual documents in an AppDB collection.
  - name: Collections
    description: Manage AppDB collections (schema, permissions).
  - name: App DB API (Product)
    description: Manage documents and collections in AppDB.
components:
  securitySchemes:
    developerToken:
      type: apiKey
      in: header
      name: X-DOMO-Developer-Token
      description: Domo Developer Token for authentication.
  schemas:
    #========= SHARED SCHEMAS =========
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: A human-readable error message.
        status:
          type: integer
          description: HTTP status code.
        statusReason:
          type: string
          description: HTTP status reason phrase.
        toe:
          type: string
          description: Trace identifier for support; stands for Thread of Execution.
          
    #========= REQUEST BODY SCHEMAS =========
    DocumentContent:
      type: object
      properties:
        content:
          type: object
          additionalProperties: true
          description: "Arbitrary JSON content of the document. If omitted, the document is created with an empty content object."

    #========= RESPONSE SCHEMAS =========
    Document:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the document.
        datastoreId:
          type: string
          description: ID of the datastore the document belongs to.
        collectionId:
          type: string
          description: ID of the collection the document belongs to.
        syncRequired:
          type: boolean
          description: Whether the document is pending a sync to the underlying dataset.
        owner:
          type: string
          description: "User ID of the document owner. v2 endpoints return this as a string; v1 endpoints (List, Get, Query, Update) return it as a numeric integer. This differs from Collection and Datastore owner fields, which are always integers."
        createdBy:
          type: string
          description: "User ID of the user who created the document. v2 endpoints always return this field. v1 endpoints return it only from Create Document; all other v1 endpoints (List, Get, Query, Update) omit it."
        createdOn:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the document was created.
        updatedOn:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the document was last updated.
        updatedBy:
          type: string
          description: "User ID of the user who last updated the document. v2 endpoints return this as a string; v1 endpoints return it as a numeric integer."
        content:
          type: object
          additionalProperties: true
          description: Arbitrary JSON content of the document.
      example:
        id: "a8428d64-a01d-49b2-9144-ddeec001acf8"
        datastoreId: "39b88a97-8247-4c0d-ba1d-8ed78d1a6680"
        collectionId: "232e6d6c-46e9-49b6-a137-8933f0f05999"
        syncRequired: true
        owner: "870010733"
        createdBy: "870010733"
        createdOn: "2026-06-23T20:58:06.567Z"
        updatedOn: "2026-06-23T23:36:13.177Z"
        updatedBy: "870010733"
        content:
          campaignName: "Q2 Campaign"
          region: "West"
          status: "Active"

    QueryRequest:
      type: object
      additionalProperties: true
      description: A MongoDB-style query object.

    CollectionColumn:
      type: object
      properties:
        type:
          type: string
          enum: [STRING, LONG, DECIMAL, DOUBLE, DATE, DATETIME]
        name:
          type: string

    CollectionSummary:
      type: object
      description: Simplified collection object returned by Query Collections.
      properties:
        id:
          type: string
          format: uuid
        owner:
          type: integer
          description: "Numeric user ID of the collection owner. Note: Collection and Datastore owner fields are always integers; Document owner fields differ by endpoint version (see Document schema)."
        name:
          type: string
        syncEnabled:
          type: boolean
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
        documentCount:
          type: integer
          description: Number of documents in the collection.
        datastoreId:
          type: string
          format: uuid
        datastoreName:
          type: string

    CollectionUpdateRequest:
      type: object
      description: "All fields are optional. Only the fields you include are updated; omitted fields are left unchanged."
      properties:
        name:
          type: string
          description: New name for the collection.
        schema:
          type: object
          description: "Updated column schema for this collection. Required before enabling DataSet sync. Requires admin privilege. Valid column types: `STRING`, `LONG`, `DECIMAL`, `DOUBLE`, `DATE`, `DATETIME`. The legacy field name `schemaJson` is also accepted."
          properties:
            columns:
              type: array
              items:
                $ref: '#/components/schemas/CollectionColumn'
        syncEnabled:
          type: boolean
          description: "Whether to enable periodic syncing of documents to a linked Domo DataSet. Returns a 400 if set to `true` and the collection has no schema — set `schema` first."
        fullReplaceRequired:
          type: boolean
          description: Whether the next DataSet sync should fully replace existing rows rather than upsert.
        defaultPermissions:
          type: string
          nullable: true
          description: "Comma-separated default permission set for new app grants on this collection. `READ` is always appended even if omitted. When `null` or blank, defaults to `READ,CREATE_CONTENT,READ_CONTENT,UPDATE_CONTENT,DELETE_CONTENT`. Valid values: `ADMIN`, `SHARE`, `DELETE`, `WRITE`, `READ`, `CREATE_CONTENT`, `READ_CONTENT`, `UPDATE_CONTENT`, `DELETE_CONTENT`. Requires admin privilege."
        owner:
          type: integer
          description: "Numeric user ID to set as the collection owner. Requires admin privilege to change."
        requiredAuthorities:
          type: object
          nullable: true
          description: "Maps `CollectionOperation` names to arrays of authority strings. When set, only users with matching authorities may perform the corresponding operation. Requires admin privilege."
        filters:
          type: array
          nullable: true
          description: "Array of document-level filter predicates applied to read operations on this collection. Requires WRITE permission on the collection."
          items:
            type: object

    Datastore:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the datastore.
        name:
          type: string
          description: Name of the datastore.
        customer:
          type: string
          description: The Domo instance name this datastore belongs to.
        owner:
          type: integer
          description: User ID of the datastore owner.
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
        updatedBy:
          type: integer
          description: User ID of the user who last updated the datastore.
        datastore_id:
          type: integer
          description: "Internal numeric ID for the datastore. Present in Get and List responses; absent in the Create response."
        temporary:
          type: boolean
          description: Whether the datastore is temporary.
      example:
        id: "39b88a97-8247-4c0d-ba1d-8ed78d1a6680"
        name: "My App Datastore"
        customer: "mycompany"
        owner: 870010733
        createdOn: "2024-01-15T18:42:17.293Z"
        updatedOn: "2024-01-15T18:42:17.293Z"
        updatedBy: 870010733
        datastore_id: 125691
        temporary: false

    Collection:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the collection.
        datastoreId:
          type: string
          format: uuid
          description: ID of the datastore this collection belongs to.
        defaultPermissions:
          nullable: true
          description: "Comma-separated default permission set for new app grants on this collection, or null if not set."
        requiredAuthorities:
          nullable: true
          description: "Maps CollectionOperation names to required authority strings, or null if not set."
        owner:
          type: integer
          description: User ID of the collection owner.
        name:
          type: string
          description: Name of the collection.
        datasourceId:
          type: string
          nullable: true
          description: ID of the linked Domo DataSet, or null if not yet linked.
        schema:
          type: object
          properties:
            columns:
              type: array
              items:
                $ref: '#/components/schemas/CollectionColumn'
        filters:
          nullable: true
          description: "Array of document-level filter predicates applied to read operations, or null if not set."
        syncEnabled:
          type: boolean
          description: Whether documents are periodically synced to the linked DataSet.
        syncRequired:
          type: boolean
          description: Whether a sync is pending.
        fullReplaceRequired:
          type: boolean
        lastSync:
          type: string
          format: date-time
          nullable: true
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
        updatedBy:
          type: integer
      example:
        id: "232e6d6c-46e9-49b6-a137-8933f0f05999"
        datastoreId: "39b88a97-8247-4c0d-ba1d-8ed78d1a6680"
        defaultPermissions: null
        requiredAuthorities: null
        owner: 870010733
        name: "users"
        datasourceId: null
        schema:
          columns:
            - type: "STRING"
              name: "username"
            - type: "STRING"
              name: "email"
        filters: null
        syncEnabled: true
        syncRequired: false
        fullReplaceRequired: false
        lastSync: null
        createdOn: "2024-01-15T18:42:30.115Z"
        updatedOn: "2024-01-15T18:42:30.115Z"
        updatedBy: 870010733

security:
  - developerToken: []

paths:
  #========= Collection Endpoints =========
  /api/datastores/v1/collections:
    get:
      summary: List Collections
      description: Get all collections visible to the current user. Use `datastoreId` to filter by datastore.
      tags:
        - App DB API (Product)
      parameters:
        - name: datastoreId
          in: query
          required: false
          schema: { type: string }
          description: Filter collections by datastore ID.
        - name: shareable
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: When true, returns only collections the current user can share.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Collection'
              example:
                - id: "cf97ef6f-4c7c-4739-9af5-5cc0bd782ddb"
                  datastoreId: "78a89993-3d3a-4b57-a325-1b3886fe1e1b"
                  defaultPermissions: "READ,CREATE_CONTENT,READ_CONTENT,UPDATE_CONTENT,DELETE_CONTENT"
                  requiredAuthorities: null
                  owner: 870010733
                  name: "groups"
                  datasourceId: null
                  schema: null
                  filters: null
                  syncEnabled: false
                  syncRequired: false
                  fullReplaceRequired: false
                  lastSync: null
                  createdOn: "2026-06-24T20:09:12.502Z"
                  updatedOn: "2026-06-24T20:09:12.502Z"
                  updatedBy: 870010733
                - id: "8050a95f-7865-4ed9-bbeb-a82eaf1d1c41"
                  datastoreId: "f812ea02-0e52-478b-90f0-00aad7e05029"
                  defaultPermissions: null
                  requiredAuthorities: null
                  owner: 870010733
                  name: "users"
                  datasourceId: "de683ed7-eb83-4799-a9c7-876da6b5b008"
                  schema:
                    columns:
                      - type: "STRING"
                        name: "username"
                      - type: "DATETIME"
                        name: "joined"
                  filters: null
                  syncEnabled: true
                  syncRequired: false
                  fullReplaceRequired: false
                  lastSync: "2026-06-24T21:42:28Z"
                  createdOn: "2026-06-24T21:35:39.593Z"
                  updatedOn: "2026-06-24T21:42:28.493Z"
                  updatedBy: 870010733
    post:
      summary: Create Collection
      description: Create a new collection in a datastore. Pass `datastoreId` as a query parameter.
      tags:
        - App DB API (Product)
      parameters:
        - name: datastoreId
          in: query
          required: true
          schema: { type: string }
          description: The ID of the datastore to create the collection in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name for the collection.
                syncEnabled:
                  type: boolean
                  description: "Whether to enable periodic syncing to a linked Domo DataSet. Requires `schema` to be provided; the API returns a 400 if `syncEnabled: true` is passed without a schema."
                schema:
                  type: object
                  properties:
                    columns:
                      type: array
                      items:
                        $ref: '#/components/schemas/CollectionColumn'
            example:
              name: "users"
              syncEnabled: true
              schema:
                columns:
                  - name: "username"
                    type: "STRING"
                  - name: "email"
                    type: "STRING"
      responses:
        '201':
          description: Collection created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'

  /api/datastores/v1/collections/query:
    post:
      summary: Query Collections
      description: Filter and sort collections using field-level predicates with pagination.
      tags:
        - App DB API (Product)
      parameters:
        - name: ownedBy
          in: query
          required: false
          schema: { type: boolean, default: true }
          description: Include a summary of collections grouped by owner in the response.
        - name: createdOn
          in: query
          required: false
          schema: { type: boolean, default: true }
          description: Include a summary of collections grouped by creation date in the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionFilteringList:
                  type: array
                  items:
                    type: object
                    properties:
                      filterType:
                        type: string
                        enum: [datastorename, ownedby, createddate, nameof]
                        description: "`datastorename` — filter by the app/card name. `ownedby` — filter by owner user ID. `createddate` — filter by creation date. `nameof` — filter by collection name."
                      not:
                        type: boolean
                        nullable: true
                        description: When true, inverts the filter (supported for `ownedby`, `createddate` with `on`, and `nameof`).
                      comparingCriteria:
                        type: string
                        nullable: true
                        description: "Required for `createddate`. One of: `after`, `before`, `on`."
                      typedValue:
                        type: string
                        description: "The value to filter on: a user ID for `ownedby`, an ISO date for `createddate`, or a name string for `nameof` and `datastorename`."
                sortBy:
                  type: string
                  description: "Field to sort by. One of: `documentCount`, `createdOn`, `updatedOn`, `name`, `datastoreName`."
                direction:
                  type: string
                  enum: [ASC, DESC]
                pageSize:
                  type: integer
                  default: -1
                  description: "Number of results per page. Pass `-1` to return all results."
                pageNumber:
                  type: integer
                  default: -1
                  description: "1-indexed page number. Pass `-1` to return all results."
            example:
              collectionFilteringList:
                - filterType: "nameof"
                  typedValue: "users"
              sortBy: "createdOn"
              direction: "DESC"
              pageSize: 25
              pageNumber: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCollectionCount:
                    type: integer
                  pageSize:
                    type: integer
                  pageNumber:
                    type: integer
                  pageCount:
                    type: integer
                  collections:
                    type: array
                    items:
                      $ref: '#/components/schemas/CollectionSummary'
                  ownedBy:
                    type: array
                    description: Aggregate of collections grouped by owner. Present when the `ownedBy` query parameter is true (default).
                    items:
                      type: object
                      properties:
                        ownerId:
                          type: string
                        ownerName:
                          type: string
                        collectionCount:
                          type: integer
                  createdOn:
                    type: object
                    description: Aggregate of collections grouped by creation date. Present when the `createdOn` query parameter is true (default).
                    properties:
                      sevenDaysAgo:
                        type: integer
                      fifteenDaysAgo:
                        type: integer
                      thirtyDaysAgo:
                        type: integer
              example:
                totalCollectionCount: 1
                pageSize: 1
                pageNumber: 1
                pageCount: 1
                collections:
                  - id: "232e6d6c-46e9-49b6-a137-8933f0f05999"
                    owner: 870010733
                    name: "users"
                    syncEnabled: true
                    createdOn: "2024-01-15T18:42:30.115Z"
                    updatedOn: "2024-01-15T18:42:30.115Z"
                    documentCount: 42
                    datastoreId: "39b88a97-8247-4c0d-ba1d-8ed78d1a6680"
                    datastoreName: "My App Datastore"
                ownedBy:
                  - ownerId: "870010733"
                    ownerName: "Jane Smith"
                    collectionCount: 1
                createdOn:
                  sevenDaysAgo: 0
                  fifteenDaysAgo: 1
                  thirtyDaysAgo: 1

  /api/datastores/v1/collections/{collectionId}:
    get:
      summary: Get Collection
      description: Get a collection by ID.
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
    put:
      summary: Update Collection
      description: "Update one or more fields on a collection. All request body fields are optional — only the fields you include are changed."
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionUpdateRequest'
            examples:
              rename:
                summary: Rename a collection
                value:
                  name: "My new name"
              update-schema:
                summary: Update schema
                value:
                  schema:
                    columns:
                      - type: STRING
                        name: theme
                      - type: STRING
                        name: defaultView
                  syncEnabled: true
              rename-and-update-schema:
                summary: Rename and update schema
                value:
                  name: "preferences"
                  schema:
                    columns:
                      - type: STRING
                        name: theme
                      - type: STRING
                        name: defaultView
                  syncEnabled: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
    delete:
      summary: Delete Collection
      description: Permanently delete a collection and all of its documents.
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection to delete.
      responses:
        '204':
          description: Collection deleted. No response body is returned.

  /api/datastores/v1/collections/{collectionId}/permission/RYUU_APP/{proxyId}:
    put:
      summary: Update Collection Permissions
      description: Update permissions for a collection as it relates to a specific Custom App.
      tags: 
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - name: proxyId
          in: path
          required: true
          schema: { type: string }
          description: Proxy ID available in the Asset Library.
        - name: permissions
          in: query
          required: true
          description: "Comma-separated list of permissions (e.g., read,create_content)."
          schema:
            type: string
            example: "read,create_content,read_content"
      responses:
        '204':
          description: No Content

  /api/datastores/v1/collections/{collectionId}/permission:
    get:
      summary: List Collection Permissions
      description: List all entities that have permissions on a collection, optionally filtered by entity type or ID.
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - name: sourceType
          in: query
          required: false
          schema:
            type: string
            enum: [USER, GROUP, RYUU_APP]
          description: Filter by entity type.
        - name: sourceIds
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: Filter by specific entity IDs.
      responses:
        '200':
          description: OK. Returns a map of entity type to list of permission entries.
          content:
            application/json:
              schema:
                type: object
                description: "Keys are entity types (`USER`, `GROUP`, `RYUU_APP`). Values are arrays of permission entries."
                additionalProperties:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: The entity ID (user ID, group ID, or proxy ID).
                      permissions:
                        type: array
                        items:
                          type: string
                        description: "List of permissions granted. Values are uppercase: `ADMIN`, `READ`, `WRITE`, `SHARE`, `DELETE`, `CREATE_CONTENT`, `READ_CONTENT`, `UPDATE_CONTENT`, `DELETE_CONTENT`."
                      name:
                        type: string
                        description: Display name of the entity, if available.
              example:
                USER:
                  - id: "870010733"
                    permissions: ["ADMIN", "SHARE", "DELETE", "WRITE", "READ"]
                RYUU_APP:
                  - id: "a1b2c3d4-1234-5678-abcd-ef0123456789"
                    permissions: ["READ", "CREATE_CONTENT", "READ_CONTENT", "UPDATE_CONTENT", "DELETE_CONTENT"]

  /api/datastores/v1/collections/{collectionId}/permission/user:
    get:
      summary: Check User Permission
      description: Returns `true` if the current user has permission to edit permissions on the collection, `false` otherwise.
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: boolean

  #========= Datastore Endpoints =========
  /api/datastores/v1:
    get:
      summary: List Datastores
      description: Get all datastores owned by the current user.
      tags:
        - App DB API (Product)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Datastore'
    post:
      summary: Create Datastore
      description: Create a new datastore.
      tags:
        - App DB API (Product)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name for the new datastore.
            example:
              name: "My App Datastore"
      responses:
        '201':
          description: Datastore created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Datastore'
              example:
                id: "98572030-591b-4b6e-94dd-817a30ec5e2f"
                name: "My App Datastore"
                customer: "mycompany"
                owner: 870010733
                createdOn: "2026-06-24T21:17:18.767Z"
                updatedOn: "2026-06-24T21:17:18.767Z"
                updatedBy: 870010733
                temporary: false

  /api/datastores/v1/{datastoreId}:
    get:
      summary: Get Datastore
      description: Get a datastore by ID.
      tags:
        - App DB API (Product)
      parameters:
        - name: datastoreId
          in: path
          required: true
          schema: { type: string }
          description: "The UUID of the datastore. Use the `id` field from the datastore object — **not** the numeric `datastore_id` field. For example, `98572030-591b-4b6e-94dd-817a30ec5e2f` is valid; `157944` is not."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Datastore'
              example:
                id: "98572030-591b-4b6e-94dd-817a30ec5e2f"
                name: "My App Datastore"
                customer: "mycompany"
                owner: 870010733
                createdOn: "2026-06-24T21:17:18.767Z"
                updatedOn: "2026-06-24T21:17:18.767Z"
                updatedBy: 870010733
                datastore_id: 157944
                temporary: false
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "No static resource api/datastores/v1/157944 for request '/api/datastores/v1/157944'."
                status: 404
                statusReason: "Not Found"
