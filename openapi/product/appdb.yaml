openapi: 3.0.0
info:
  title: App DB API
  version: v1
  description: |
    The App DB API allows developers to interact with AppDB, a NoSQL database 
    for storing arbitrary JSON documents. This API supports CRUD operations, 
    querying, and aggregation, enabling developers to manage data efficiently 
    within their Domo applications.
servers:
  - url: 'https://{instance}.domo.com'
    description: Domo Instance
    variables:
      instance:
        default: 'api'
        description: 'Your specific Domo instance name (e.g., mycompany)'
tags:
  - name: Documents
    description: Manage individual documents in an AppDB collection.
  - name: Collections
    description: Manage AppDB collections (schema, permissions).
  - name: App DB API (Product)
    description: Manage documents and collections in AppDB.
components:
  securitySchemes:
    developerToken:
      type: apiKey
      in: header
      name: X-DOMO-Developer-Token
      description: Domo Developer Token for authentication.
  schemas:
    #========= SHARED SCHEMAS =========
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: A human-readable error message.
        status:
          type: integer
          description: HTTP status code.
        statusReason:
          type: string
          description: HTTP status reason phrase.
        toe:
          type: string
          description: Trace identifier for support; stands for Thread of Execution.
          
    #========= REQUEST BODY SCHEMAS =========
    DocumentContent:
      type: object
      properties:
        content:
          type: object
          additionalProperties: true
          description: "Arbitrary JSON content of the document. If omitted, the document is created with an empty content object."

    #========= RESPONSE SCHEMAS =========
    Document:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the document.
        datastoreId:
          type: string
          description: ID of the datastore the document belongs to.
        collectionId:
          type: string
          description: ID of the collection the document belongs to.
        syncRequired:
          type: boolean
          description: Whether the document is pending a sync to the underlying dataset.
        owner:
          type: string
          description: User ID of the document owner.
        createdBy:
          type: string
          description: "User ID of the user who created the document. v2 endpoints always return this field. v1 endpoints return it only from Create Document and Query Document; v1 List Documents, Get Document, and Update Document omit it."
        createdOn:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the document was created.
        updatedOn:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the document was last updated.
        updatedBy:
          type: string
          description: User ID of the user who last updated the document.
        content:
          type: object
          additionalProperties: true
          description: Arbitrary JSON content of the document.
      example:
        id: "a8428d64-a01d-49b2-9144-ddeec001acf8"
        datastoreId: "39b88a97-8247-4c0d-ba1d-8ed78d1a6680"
        collectionId: "232e6d6c-46e9-49b6-a137-8933f0f05999"
        syncRequired: true
        owner: "870010733"
        createdBy: "870010733"
        createdOn: "2026-06-23T20:58:06.567Z"
        updatedOn: "2026-06-23T23:36:13.177Z"
        updatedBy: "870010733"
        content:
          campaignName: "Q2 Campaign"
          region: "West"
          status: "Active"

    QueryRequest:
      type: object
      additionalProperties: true
      description: A MongoDB-style query object.

    CollectionColumn:
      type: object
      properties:
        type:
          type: string
          enum: [STRING, LONG, DECIMAL, DOUBLE, DATE, DATETIME]
        name:
          type: string
        visible:
          type: boolean
          
    CollectionSchemaRequest:
      type: object
      properties:
        schema:
          type: object
          properties:
            columns:
              type: array
              items:
                $ref: '#/components/schemas/CollectionColumn'
        syncEnabled:
          type: boolean

    Datastore:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the datastore.
        name:
          type: string
          description: Name of the datastore.
        customer:
          type: string
          description: The Domo instance name this datastore belongs to.
        owner:
          type: integer
          description: User ID of the datastore owner.
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
        updatedBy:
          type: integer
      example:
        id: "39b88a97-8247-4c0d-ba1d-8ed78d1a6680"
        name: "My App Datastore"
        customer: "mycompany"
        owner: 870010733
        createdOn: "2024-01-15T10:00:00.000Z"
        updatedOn: "2024-01-15T10:00:00.000Z"

    Collection:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the collection.
        datastoreId:
          type: string
          format: uuid
          description: ID of the datastore this collection belongs to.
        name:
          type: string
          description: Name of the collection.
        owner:
          type: integer
          description: User ID of the collection owner.
        datasourceId:
          type: string
          nullable: true
          description: ID of the linked Domo DataSet, or null if not yet linked.
        schema:
          type: object
          properties:
            columns:
              type: array
              items:
                $ref: '#/components/schemas/CollectionColumn'
        syncEnabled:
          type: boolean
          description: Whether documents are periodically synced to the linked DataSet.
        syncRequired:
          type: boolean
          description: Whether a sync is pending.
        fullReplaceRequired:
          type: boolean
        lastSync:
          type: string
          format: date-time
          nullable: true
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
        updatedBy:
          type: integer
      example:
        id: "232e6d6c-46e9-49b6-a137-8933f0f05999"
        datastoreId: "39b88a97-8247-4c0d-ba1d-8ed78d1a6680"
        name: "users"
        owner: 870010733
        datasourceId: null
        schema:
          columns:
            - type: "STRING"
              name: "username"
              visible: true
            - type: "STRING"
              name: "email"
              visible: true
        syncEnabled: true
        syncRequired: true
        fullReplaceRequired: false
        lastSync: null
        createdOn: "2024-01-15T10:00:00.000Z"
        updatedOn: "2024-01-15T10:00:00.000Z"
        updatedBy: 870010733

security:
  - developerToken: []

paths:
  #========= Collection Endpoints =========
  /api/datastores/v1/collections:
    get:
      summary: List Collections
      description: Get all collections visible to the current user. Use `datastoreId` to filter by datastore.
      tags:
        - App DB API (Product)
      parameters:
        - name: datastoreId
          in: query
          required: false
          schema: { type: string }
          description: Filter collections by datastore ID.
        - name: shareable
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: When true, returns only collections the current user can share.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Collection'
    post:
      summary: Create Collection
      description: Create a new collection in a datastore. Pass `datastoreId` as a query parameter.
      tags:
        - App DB API (Product)
      parameters:
        - name: datastoreId
          in: query
          required: true
          schema: { type: string }
          description: The ID of the datastore to create the collection in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name for the collection.
                syncEnabled:
                  type: boolean
                  description: Whether to enable periodic syncing to a linked Domo DataSet.
                schema:
                  type: object
                  properties:
                    columns:
                      type: array
                      items:
                        $ref: '#/components/schemas/CollectionColumn'
            example:
              name: "users"
              syncEnabled: true
              schema:
                columns:
                  - name: "username"
                    type: "STRING"
                    visible: true
                  - name: "email"
                    type: "STRING"
                    visible: true
      responses:
        '201':
          description: Collection created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'

  /api/datastores/v1/collections/query:
    post:
      summary: Query Collections
      description: Filter and sort collections using field-level predicates with pagination.
      tags:
        - App DB API (Product)
      parameters:
        - name: ownedBy
          in: query
          required: false
          schema: { type: boolean, default: true }
          description: Include a summary of collections grouped by owner in the response.
        - name: createdOn
          in: query
          required: false
          schema: { type: boolean, default: true }
          description: Include a summary of collections grouped by creation date in the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionFilteringList:
                  type: array
                  items:
                    type: object
                    properties:
                      filterType:
                        type: string
                        enum: [datastorename, ownedby, createddate, nameof]
                        description: "`datastorename` — filter by the app/card name. `ownedby` — filter by owner user ID. `createddate` — filter by creation date. `nameof` — filter by collection name."
                      not:
                        type: boolean
                        nullable: true
                        description: When true, inverts the filter (supported for `ownedby`, `createddate` with `on`, and `nameof`).
                      comparingCriteria:
                        type: string
                        nullable: true
                        description: "Required for `createddate`. One of: `after`, `before`, `on`."
                      typedValue:
                        type: string
                        description: "The value to filter on: a user ID for `ownedby`, an ISO date for `createddate`, or a name string for `nameof` and `datastorename`."
                sortBy:
                  type: string
                  description: "Field to sort by. One of: `documentCount`, `createdOn`, `updatedOn`, `name`, `datastoreName`."
                direction:
                  type: string
                  enum: [ASC, DESC]
                pageSize:
                  type: integer
                  default: -1
                  description: "Number of results per page. Pass `-1` to return all results."
                pageNumber:
                  type: integer
                  default: -1
                  description: "1-indexed page number. Pass `-1` to return all results."
            example:
              collectionFilteringList:
                - filterType: "nameof"
                  typedValue: "users"
              sortBy: "createdOn"
              direction: "DESC"
              pageSize: 25
              pageNumber: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCollectionCount:
                    type: integer
                  pageSize:
                    type: integer
                  pageNumber:
                    type: integer
                  pageCount:
                    type: integer
                  collections:
                    type: array
                    items:
                      $ref: '#/components/schemas/Collection'

  /api/datastores/v1/collections/{collectionId}:
    get:
      summary: Get Collection
      description: Get a collection by ID.
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
    put:
      summary: Update Collection Schema
      description: Update the schema of a collection.
      tags: 
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionSchemaRequest'
      responses:
        '200':
          description: OK
    delete:
      summary: Delete Collection
      description: Permanently delete a collection and all of its documents.
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection to delete.
      responses:
        '204':
          description: Collection deleted. No response body is returned.

  /api/datastores/v1/collections/{collectionId}/permission/RYUU_APP/{proxyId}:
    put:
      summary: Update Collection Permissions
      description: Update permissions for a collection as it relates to a specific Custom App.
      tags: 
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - name: proxyId
          in: path
          required: true
          schema: { type: string }
          description: Proxy ID available in the Asset Library.
        - name: permissions
          in: query
          required: true
          description: "Comma-separated list of permissions (e.g., read,create_content)."
          schema:
            type: string
            example: "read,create_content,read_content"
      responses:
        '204':
          description: No Content

  /api/datastores/v1/collections/{collectionId}/permission:
    get:
      summary: List Collection Permissions
      description: List all entities that have permissions on a collection, optionally filtered by entity type or ID.
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - name: sourceType
          in: query
          required: false
          schema:
            type: string
            enum: [USER, GROUP, RYUU_APP]
          description: Filter by entity type.
        - name: sourceIds
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: Filter by specific entity IDs.
      responses:
        '200':
          description: OK. Returns a map of entity type to list of permission entries.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: object
                    properties:
                      sourceType:
                        type: string
                      sourceId:
                        type: string
                      permissions:
                        type: array
                        items:
                          type: string
              example:
                RYUU_APP:
                  - sourceType: "RYUU_APP"
                    sourceId: "a1b2c3d4-0000-0000-0000-000000000000"
                    permissions: ["read", "create_content", "read_content"]

  /api/datastores/v1/collections/{collectionId}/permission/user:
    get:
      summary: Check User Permission
      description: Returns `true` if the current user has permission to edit permissions on the collection, `false` otherwise.
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: boolean

  #========= Datastore Endpoints =========
  /api/datastores/v1:
    get:
      summary: List Datastores
      description: Get all datastores owned by the current user.
      tags:
        - App DB API (Product)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Datastore'
    post:
      summary: Create Datastore
      description: Create a new datastore.
      tags:
        - App DB API (Product)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name for the new datastore.
            example:
              name: "My App Datastore"
      responses:
        '201':
          description: Datastore created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Datastore'

  /api/datastores/v1/{datastoreId}:
    get:
      summary: Get Datastore
      description: Get a datastore by ID.
      tags:
        - App DB API (Product)
      parameters:
        - name: datastoreId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the datastore.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Datastore'
    delete:
      summary: Delete Datastore
      description: "Permanently delete a datastore and all of its collections and documents. **This action cannot be undone.**"
      tags:
        - App DB API (Product)
      parameters:
        - name: datastoreId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the datastore to delete.
      responses:
        '204':
          description: Datastore deleted successfully. No response body is returned.

  /api/datastores/v1/export/{datastoreId}:
    post:
      summary: Export Datastore (v1, Deprecated)
      deprecated: true
      description: "**Deprecated.** Use the [v2 Export Datastore](#operation/exportDatastoreV2) endpoint instead. Triggers an async sync of all collections in the datastore to their linked Domo DataSets. Each collection must have `syncEnabled: true` and a linked `datasourceId` to be exported."
      tags:
        - App DB API (Product)
      parameters:
        - name: datastoreId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the datastore.
      responses:
        '200':
          description: Export triggered successfully. No response body is returned.

  /api/datastores/v2/export/{datastoreId}:
    post:
      operationId: exportDatastoreV2
      summary: Export Datastore
      description: "Triggers an async sync of one or more collections in the datastore to their linked Domo DataSets. Pass the IDs of the collections to export in the request body. Each collection must have `syncEnabled: true` and a linked `datasourceId` to be exported."
      tags:
        - App DB API (Product)
      parameters:
        - name: datastoreId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the datastore.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
              description: List of collection IDs to export.
            example:
              - "232e6d6c-46e9-49b6-a137-8933f0f05999"
      responses:
        '200':
          description: Export triggered successfully. No response body is returned.

  #========= Document Endpoints (v1, Deprecated) =========
  /api/datastores/v1/collections/{collectionId}/documents:
    get:
      summary: List Documents (v1, Deprecated)
      deprecated: true
      description: "**Deprecated.** Use the [v2 List Documents](#operation/listDocumentsV2) endpoint instead. This v1 endpoint returns a stripped-down document object that omits `createdBy` and returns numeric user IDs instead of strings."
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - name: limit
          in: query
          schema: { type: integer }
          description: Maximum number of documents to return.
        - name: offset
          in: query
          schema: { type: integer }
          description: Number of documents to skip before returning. Default is 0.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
              example:
                - id: "a8428d64-a01d-49b2-9144-ddeec001acf8"
                  datastoreId: "39b88a97-8247-4c0d-ba1d-8ed78d1a6680"
                  collectionId: "232e6d6c-46e9-49b6-a137-8933f0f05999"
                  syncRequired: true
                  owner: 870010733
                  createdOn: "2026-06-23T20:58:06.567Z"
                  updatedOn: "2026-06-23T23:36:13.177Z"
                  updatedBy: 870010733
                  content:
                    campaignName: "Q2 Campaign"
                    region: "West"
                    status: "Active"

    post:
      summary: Create Document (v1, Deprecated)
      deprecated: true
      description: "**Deprecated.** Use the v2 Create Document endpoint instead. Add a new document to a specified collection."
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentContent'
            example:
              content: { "campaignName": "Q2 Campaign", "region": "West", "status": "Active" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'

  /api/datastores/v1/collections/{collectionId}/documents/{documentId}:
    get:
      summary: Get Document (v1, Deprecated)
      deprecated: true
      description: "**Deprecated.** Use the [v2 Get Document](#operation/getDocumentV2) endpoint instead. This v1 endpoint returns a stripped-down document object that omits `createdBy` and returns numeric user IDs instead of strings."
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - name: documentId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the document.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Document with id 'b1e2f3a4-c5d6-7890-abcd-ef1234567890' not found"
                status: 404
                statusReason: "Not Found"
                toe: "1Y7SXEXLME-YM859-UOWZK"

    put:
      summary: Update Document (v1, Deprecated)
      deprecated: true
      description: "**Deprecated.** Use the v2 Update Document endpoint instead. Modify an existing document in a collection."
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - name: documentId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the document.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentContent'
            example:
              content: { "campaignName": "Q2 Campaign", "region": "West", "status": "Inactive" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
              example:
                id: "a8428d64-a01d-49b2-9144-ddeec001acf8"
                datastoreId: "39b88a97-8247-4c0d-ba1d-8ed78d1a6680"
                collectionId: "232e6d6c-46e9-49b6-a137-8933f0f05999"
                syncRequired: true
                owner: 870010733
                createdOn: "2026-06-23T20:58:06.567Z"
                updatedOn: "2026-06-24T14:22:11.403Z"
                updatedBy: 870010733
                content:
                  campaignName: "Q2 Campaign"
                  region: "West"
                  status: "Inactive"
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Could not find document with id 'b1e2f3a4-c5d6-7890-abcd-ef1234567890' to update"
                status: 404
                statusReason: "Not Found"
                toe: "HKUMCHOWVY-GRVTS-RU3ZG"

    delete:
      summary: Delete Document (v1, Deprecated)
      deprecated: true
      description: "**Deprecated.** Use the v2 Delete Document endpoint instead. Remove a document from a collection."
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - name: documentId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the document.
      responses:
        '204':
          description: The document was successfully deleted. No response body is returned.
          

        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Document could not be found: b1e2f3a4-c5d6-7890-abcd-ef1234567890"
                status: 404
                statusReason: "Not Found"
                toe: "BH3HHD53Y3-BZGE0-DQSG3"

  /api/datastores/v1/collections/{collectionId}/documents/bulk:
    delete:
      summary: Bulk Delete Documents (v1, Deprecated)
      deprecated: true
      description: "**Deprecated.** Use the v2 Bulk Delete Documents endpoint instead. Remove multiple documents from a collection in a single request."
      tags: 
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - name: ids
          in: query
          required: true
          description: A comma-separated list of document IDs.
          schema:
            type: string
          example: "id1,id2,id3"
      responses:
        '202':
          description: Accepted — returns the count of deleted documents.
          content:
