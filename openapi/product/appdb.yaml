      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - name: sourceType
          in: query
          required: false
          schema:
            type: string
            enum: [USER, GROUP, RYUU_APP]
          description: Filter by entity type.
        - name: sourceIds
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: >-
            Filter by specific entity IDs. User and group IDs are numeric (for example, `870010733`); app (`RYUU_APP`) IDs are UUIDs (for example, `fcd8baba-9524-4fb5-b94b-b3d3b588e740`).
      responses:
