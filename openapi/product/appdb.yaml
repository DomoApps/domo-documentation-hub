openapi: 3.0.0
info:
  title: App DB API
  version: v1
  description: |
    The App DB API allows developers to interact with AppDB, a NoSQL database 
    for storing arbitrary JSON documents. This API supports CRUD operations, 
    querying, and aggregation, enabling developers to manage data efficiently 
    within their Domo applications.
servers:
  - url: 'https://{instance}.domo.com'
    description: Domo Instance
    variables:
      instance:
        default: 'api'
        description: 'Your specific Domo instance name (e.g., mycompany)'
tags:
  - name: Documents
    description: Manage individual documents in an AppDB collection.
  - name: Collections
    description: Manage AppDB collections (schema, permissions).
  - name: App DB API (Product)
    description: Manage documents and collections in AppDB.
components:
  securitySchemes:
    developerToken:
      type: apiKey
      in: header
      name: X-DOMO-Developer-Token
      description: Domo Developer Token for authentication.
  schemas:
    #========= SHARED SCHEMAS =========
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: A human-readable error message.
        status:
          type: integer
          description: HTTP status code.
        statusReason:
          type: string
          description: HTTP status reason phrase.
        toe:
          type: string
          description: Trace identifier for support; stands for Thread of Execution.
          
    #========= REQUEST BODY SCHEMAS =========
    DocumentContent:
      type: object
      properties:
        content:
          type: object
          additionalProperties: true
          description: "Arbitrary JSON content of the document. If omitted, the document is created with an empty content object."

    #========= RESPONSE SCHEMAS =========
    Document:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the document.
        datastoreId:
          type: string
          description: ID of the datastore the document belongs to.
        collectionId:
          type: string
          description: ID of the collection the document belongs to.
        syncRequired:
          type: boolean
          description: Whether the document is pending a sync to the underlying dataset.
        owner:
          type: string
          description: User ID of the document owner.
        createdBy:
          type: string
          description: "User ID of the user who created the document. v2 endpoints always return this field. v1 endpoints return it only from Create Document and Query Document; v1 List Documents, Get Document, and Update Document omit it."
        createdOn:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the document was created.
        updatedOn:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the document was last updated.
        updatedBy:
          type: string
          description: User ID of the user who last updated the document.
        content:
          type: object
          additionalProperties: true
          description: Arbitrary JSON content of the document.
      example:
        id: "a8428d64-a01d-49b2-9144-ddeec001acf8"
        datastoreId: "39b88a97-8247-4c0d-ba1d-8ed78d1a6680"
        collectionId: "232e6d6c-46e9-49b6-a137-8933f0f05999"
        syncRequired: true
        owner: "870010733"
        createdBy: "870010733"
        createdOn: "2026-06-23T20:58:06.567Z"
        updatedOn: "2026-06-23T23:36:13.177Z"
        updatedBy: "870010733"
        content:
          campaignName: "Q2 Campaign"
          region: "West"
          status: "Active"

    QueryRequest:
      type: object
      additionalProperties: true
      description: A MongoDB-style query object.

    CollectionColumn:
      type: object
      properties:
        type:
          type: string
          enum: [STRING, LONG, DECIMAL, DOUBLE, DATE, DATETIME]
        name:
          type: string
        visible:
          type: boolean
          
    CollectionSchemaRequest:
      type: object
      properties:
        schema:
          type: object
          properties:
            columns:
              type: array
              items:
                $ref: '#/components/schemas/CollectionColumn'
        syncEnabled:
          type: boolean
          
security:
  - developerToken: []

paths:
  #========= Collection Endpoints =========
  /api/datastores/v1/collections/{collectionId}:
    put:
      summary: Update Collection Schema
      description: Update the schema of a collection.
      tags: 
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionSchemaRequest'
      responses:
        '200':
          description: OK

  /api/datastores/v1/collections/{collectionId}/permission/RYUU_APP/{proxyId}:
    put:
      summary: Update Collection Permissions
      description: Update permissions for a collection as it relates to a specific Custom App.
      tags: 
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - name: proxyId
          in: path
          required: true
          schema: { type: string }
          description: Proxy ID available in the Asset Library.
        - name: permissions
          in: query
          required: true
          description: "Comma-separated list of permissions (e.g., read,create_content)."
          schema:
            type: string
            example: "read,create_content,read_content"
      responses:
        '204':
          description: No Content

  #========= Datastore Endpoints =========
  /api/datastores/v1/export/{datastoreId}:
    post:
      summary: Export Datastore (v1, Deprecated)
      deprecated: true
      description: "**Deprecated.** Use the [v2 Export Datastore](#operation/exportDatastoreV2) endpoint instead. Triggers an async sync of all collections in the datastore to their linked Domo DataSets. Each collection must have `syncEnabled: true` and a linked `datasourceId` to be exported."
      tags:
        - App DB API (Product)
      parameters:
        - name: datastoreId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the datastore.
      responses:
        '200':
          description: Export triggered successfully. No response body is returned.

  /api/datastores/v2/export/{datastoreId}:
    post:
      operationId: exportDatastoreV2
      summary: Export Datastore
      description: "Triggers an async sync of one or more collections in the datastore to their linked Domo DataSets. Pass the IDs of the collections to export in the request body. Each collection must have `syncEnabled: true` and a linked `datasourceId` to be exported."
      tags:
        - App DB API (Product)
      parameters:
        - name: datastoreId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the datastore.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
              description: List of collection IDs to export.
            example:
              - "232e6d6c-46e9-49b6-a137-8933f0f05999"
      responses:
        '200':
          description: Export triggered successfully. No response body is returned.

  #========= Document Endpoints (v1, Deprecated) =========
  /api/datastores/v1/collections/{collectionId}/documents:
    get:
      summary: List Documents (v1, Deprecated)
      deprecated: true
      description: "**Deprecated.** Use the [v2 List Documents](#operation/listDocumentsV2) endpoint instead. This v1 endpoint returns a stripped-down document object that omits `createdBy` and returns numeric user IDs instead of strings."
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - name: limit
          in: query
          schema: { type: integer }
          description: Maximum number of documents to return.
        - name: offset
          in: query
          schema: { type: integer }
          description: Number of documents to skip before returning. Default is 0.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
              example:
                - id: "a8428d64-a01d-49b2-9144-ddeec001acf8"
                  datastoreId: "39b88a97-8247-4c0d-ba1d-8ed78d1a6680"
                  collectionId: "232e6d6c-46e9-49b6-a137-8933f0f05999"
                  syncRequired: true
                  owner: 870010733
                  createdOn: "2026-06-23T20:58:06.567Z"
                  updatedOn: "2026-06-23T23:36:13.177Z"
                  updatedBy: 870010733
                  content:
                    campaignName: "Q2 Campaign"
                    region: "West"
                    status: "Active"

    post:
      summary: Create Document (v1, Deprecated)
      deprecated: true
      description: "**Deprecated.** Use the v2 Create Document endpoint instead. Add a new document to a specified collection."
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentContent'
            example:
              content: { "campaignName": "Q2 Campaign", "region": "West", "status": "Active" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'

  /api/datastores/v1/collections/{collectionId}/documents/{documentId}:
    get:
      summary: Get Document (v1, Deprecated)
      deprecated: true
      description: "**Deprecated.** Use the [v2 Get Document](#operation/getDocumentV2) endpoint instead. This v1 endpoint returns a stripped-down document object that omits `createdBy` and returns numeric user IDs instead of strings."
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - name: documentId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the document.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Document with id 'b1e2f3a4-c5d6-7890-abcd-ef1234567890' not found"
                status: 404
                statusReason: "Not Found"
                toe: "1Y7SXEXLME-YM859-UOWZK"

    put:
      summary: Update Document (v1, Deprecated)
      deprecated: true
      description: "**Deprecated.** Use the v2 Update Document endpoint instead. Modify an existing document in a collection."
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - name: documentId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the document.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentContent'
            example:
              content: { "campaignName": "Q2 Campaign", "region": "West", "status": "Inactive" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
              example:
                id: "a8428d64-a01d-49b2-9144-ddeec001acf8"
                datastoreId: "39b88a97-8247-4c0d-ba1d-8ed78d1a6680"
                collectionId: "232e6d6c-46e9-49b6-a137-8933f0f05999"
                syncRequired: true
                owner: 870010733
                createdOn: "2026-06-23T20:58:06.567Z"
                updatedOn: "2026-06-24T14:22:11.403Z"
                updatedBy: 870010733
                content:
                  campaignName: "Q2 Campaign"
                  region: "West"
                  status: "Inactive"
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Could not find document with id 'b1e2f3a4-c5d6-7890-abcd-ef1234567890' to update"
                status: 404
                statusReason: "Not Found"
                toe: "HKUMCHOWVY-GRVTS-RU3ZG"

    delete:
      summary: Delete Document (v1, Deprecated)
      deprecated: true
      description: "**Deprecated.** Use the v2 Delete Document endpoint instead. Remove a document from a collection."
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - name: documentId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the document.
      responses:
        '204':
          description: The document was successfully deleted. No response body is returned.
          

        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Document could not be found: b1e2f3a4-c5d6-7890-abcd-ef1234567890"
                status: 404
                statusReason: "Not Found"
                toe: "BH3HHD53Y3-BZGE0-DQSG3"

  /api/datastores/v1/collections/{collectionId}/documents/bulk:
    delete:
      summary: Bulk Delete Documents (v1, Deprecated)
      deprecated: true
      description: "**Deprecated.** Use the v2 Bulk Delete Documents endpoint instead. Remove multiple documents from a collection in a single request."
      tags: 
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - name: ids
          in: query
          required: true
          description: A comma-separated list of document IDs.
          schema:
            type: string
          example: "id1,id2,id3"
      responses:
        '202':
          description: Accepted — returns the count of deleted documents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Deleted:
                    type: integer
                    example: 2
  /api/datastores/v2/collections/{collectionId}/documents/query:
    post:
      summary: Query Document
      description: |
        Retrieve documents from a collection via MongoDB query (v2 endpoint).

        AppDB supports the full range of MongoDB query predicates. The following operators are **not** supported:
        - `$where` — JavaScript expression evaluation is disabled server-side.
        - `$near` and `$nearSphere` — proximity searches require a geospatial index, which AppDB collections do not have.

        All other operators in the [official MongoDB query predicate documentation](https://www.mongodb.com/docs/manual/reference/mql/query-predicates/) are supported, including comparison, logical, array, data type, bitwise, `$expr`, `$jsonSchema`, and `$regex` operators. The geospatial shape operators `$geoWithin` and `$geoIntersects` are also supported when your documents contain GeoJSON data.

        Dates can be queried using MongoDB Extended JSON v2: `{ "createdOn": { "$lte": { "$date": "2020-05-12T00:00:00.000Z" } } }`
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - name: groupby
          in: query
          schema: { type: string }
          description: "Comma-separated list of properties to group by. Use dot notation for nested fields (e.g., `content.campaignName`). Top-level fields can be referenced directly."
        - name: count
          in: query
          schema: { type: string }
          description: Alias for a count aggregation.
        - name: avg
          in: query
          schema: { type: string }
          description: "Comma-separated list of properties with aliases to average (e.g., `content.clicks myAlias`). Use dot notation for nested fields."
        - name: min
          in: query
          schema: { type: string }
          description: "Comma-separated list of properties with aliases to find the minimum. Use dot notation for nested fields."
        - name: max
          in: query
          schema: { type: string }
          description: "Comma-separated list of properties with aliases to find the maximum. Use dot notation for nested fields."
        - name: sum
          in: query
          schema: { type: string }
          description: "Comma-separated list of properties with aliases to sum. Use dot notation for nested fields."
        - name: unwind
          in: query
          schema: { type: string }
          description: "Comma-separated list of array properties to unwind (flattens nested arrays — one row per array element). Use dot notation for nested fields."
        - name: orderby
          in: query
          schema: { type: string }
          description: "Field or alias to order by, followed by `ascending` or `descending` (e.g., `totalClicks descending`). Accepts either an aggregation alias or a field name using dot notation."
        - name: limit
          in: query
          schema: { type: integer }
          description: Maximum number of results to return. Default is 10,000.
        - name: offset
          in: query
          schema: { type: integer }
          description: Number of results to skip before returning. Default is 0.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
            example:
              "content.region": { "$eq": "West" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
              example:
                - id: "a8428d64-a01d-49b2-9144-ddeec001acf8"
                  datastoreId: "39b88a97-8247-4c0d-ba1d-8ed78d1a6680"
                  collectionId: "232e6d6c-46e9-49b6-a137-8933f0f05999"
                  syncRequired: true
                  owner: "870010733"
                  createdBy: "870010733"
                  createdOn: "2026-06-23T20:58:06.567Z"
                  updatedOn: "2026-06-23T23:36:13.177Z"
                  updatedBy: "870010733"
                  content:
                    campaignName: "Q2 Campaign"
                    region: "West"
                    status: "Active"
                - id: "fc28d0cb-92a5-40fd-8a7c-84547d63953a"
                  datastoreId: "39b88a97-8247-4c0d-ba1d-8ed78d1a6680"
                  collectionId: "232e6d6c-46e9-49b6-a137-8933f0f05999"
                  syncRequired: true
                  owner: "870010733"
                  createdBy: "870010733"
                  createdOn: "2026-06-23T20:58:35.097Z"
                  updatedOn: "2026-06-23T21:03:40.861Z"
                  updatedBy: "870010733"
                  content:
                    campaignName: "Red Campaign"
                    region: "West"
                    status: "Inactive"

  #========= Document Endpoints (v2) =========
  /api/datastores/v2/collections/{collectionId}/documents:
    get:
      operationId: listDocumentsV2
      summary: List Documents
      description: Retrieve documents from a specified collection. There is an upper limit of 10,000 documents per request. Use `limit` and `offset` to paginate through large collections.
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - name: limit
          in: query
          schema: { type: integer }
          description: Maximum number of documents to return.
        - name: offset
          in: query
          schema: { type: integer }
          description: Number of documents to skip before returning. Default is 0.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
              example:
                - id: "a8428d64-a01d-49b2-9144-ddeec001acf8"
                  datastoreId: "39b88a97-8247-4c0d-ba1d-8ed78d1a6680"
                  collectionId: "232e6d6c-46e9-49b6-a137-8933f0f05999"
                  syncRequired: true
                  owner: "870010733"
                  createdBy: "870010733"
                  createdOn: "2026-06-23T20:58:06.567Z"
                  updatedOn: "2026-06-23T23:36:13.177Z"
                  updatedBy: "870010733"
                  content:
                    campaignName: "Q2 Campaign"
                    region: "West"
                    status: "Active"

    post:
      summary: Create Document
      description: Add a new document to a specified collection.
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentContent'
            examples:
              campaign:
                summary: Campaign document
                value:
                  content: { "campaignName": "Q2 Campaign", "region": "West", "status": "Active" }
              allTypes:
                summary: One of each supported field type
                value:
                  content:
                    name: "Example Record"
                    count: 42
                    unitPriceDecimal: 9.99
                    conversionRateDouble: 0.3333333333333333
                    startDate: "2026-06-24"
                    createdAt: "2026-06-24T17:42:06.949Z"
                    isActive: true
                    deletedAt: null
                    address:
                      street: "123 Main St"
                      city: "Austin"
                    tags: ["featured", "new", "sale"]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'

  /api/datastores/v2/collections/{collectionId}/documents/{documentId}:
    get:
      operationId: getDocumentV2
      summary: Get Document
      description: Retrieve a specific document from a collection.
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - name: documentId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the document.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Document with id 'b1e2f3a4-c5d6-7890-abcd-ef1234567890' not found"
                status: 404
                statusReason: "Not Found"
                toe: "1Y7SXEXLME-YM859-UOWZK"

    put:
      summary: Update Document
      description: Modify an existing document in a collection.
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - name: documentId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the document.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentContent'
            examples:
              campaign:
                summary: Campaign document
                value:
                  content: { "campaignName": "Q2 Campaign", "region": "West", "status": "Inactive" }
              allTypes:
                summary: One of each supported field type
                value:
                  content:
                    name: "Example Record"
                    count: 42
                    unitPriceDecimal: 9.99
                    conversionRateDouble: 0.3333333333333333
                    startDate: "2026-06-24"
                    createdAt: "2026-06-24T17:42:06.949Z"
                    isActive: true
                    deletedAt: null
                    address:
                      street: "123 Main St"
                      city: "Austin"
                    tags: ["featured", "new", "sale"]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
              example:
                id: "a8428d64-a01d-49b2-9144-ddeec001acf8"
                datastoreId: "39b88a97-8247-4c0d-ba1d-8ed78d1a6680"
                collectionId: "232e6d6c-46e9-49b6-a137-8933f0f05999"
                syncRequired: true
                owner: "870010733"
                createdBy: "870010733"
                createdOn: "2026-06-23T20:58:06.567Z"
                updatedOn: "2026-06-24T14:22:11.403Z"
                updatedBy: "870010733"
                content:
                  campaignName: "Q2 Campaign"
                  region: "West"
                  status: "Inactive"
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Could not find document with id 'b1e2f3a4-c5d6-7890-abcd-ef1234567890' to update"
                status: 404
                statusReason: "Not Found"
                toe: "HKUMCHOWVY-GRVTS-RU3ZG"

    delete:
      summary: Delete Document
      description: Remove a document from a collection.
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - name: documentId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the document.
      responses:
        '204':
          description: The document was successfully deleted. No response body is returned.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Document could not be found: b1e2f3a4-c5d6-7890-abcd-ef1234567890"
                status: 404
                statusReason: "Not Found"
                toe: "BH3HHD53Y3-BZGE0-DQSG3"

  /api/datastores/v2/collections/{collectionId}/documents/bulk:
    post:
      summary: Bulk Create Documents
      description: Add multiple documents to a collection in a single request.
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DocumentContent'
            example:
              - content: { "campaignName": "Q2 Campaign", "region": "West", "status": "Active" }
              - content: { "campaignName": "Red Campaign", "region": "East", "status": "Inactive" }
      responses:
        '200':
          description: Returns the number of created documents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Created:
                    type: integer
                    description: Number of documents created.
              example:
                Created: 2

    put:
      summary: Bulk Upsert Documents
      description: Insert or update multiple documents in a single request. Documents with a matching `id` are updated; documents without a matching `id` are created.
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: Document ID to update. Omit to create a new document.
                  content:
                    type: object
                    additionalProperties: true
                    description: Arbitrary JSON content of the document.
            example:
              - id: "a8428d64-a01d-49b2-9144-ddeec001acf8"
                content: { "campaignName": "Q2 Campaign", "region": "West", "status": "Inactive" }
              - content: { "campaignName": "New Campaign", "region": "North", "status": "Active" }
      responses:
        '200':
          description: Returns the number of updated and created documents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Updated:
                    type: integer
                    description: Number of documents updated.
                  Created:
                    type: integer
                    description: Number of documents created.
              example:
                Updated: 1
                Created: 1

    delete:
      summary: Bulk Delete Documents
      description: Remove multiple documents from a collection in a single request.
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - name: ids
          in: query
          required: true
          description: A comma-separated list of document IDs.
          schema:
            type: string
          example: "id1,id2,id3"
      responses:
        '202':
          description: Accepted — returns the count of deleted documents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Deleted:
                    type: integer
                    description: Number of documents deleted.
              example:
                Deleted: 2

  /api/datastores/v2/collections/{collectionId}/documents/update:
    put:
      summary: Partially Update Documents
      description: |
        Perform partial updates on documents using MongoDB query and update operations.
        Returns the number of documents updated. Returns `0` if no documents matched — this is a successful response, not an error.
        `$setOnInsert` has no effect because AppDB partial updates do not perform upserts.

        **Supported update operators:** `currentDate`, `inc`, `min`, `max`, `mul`, `rename`, `set`, `unset`, `addToSet`, `pop`, `pull`, `pullAll`, `push`

        **Supported modifiers:** `each`, `position`, `slice`, `sort`

        See the [MongoDB Update Operators documentation](https://www.mongodb.com/docs/manual/reference/mql/update/) for details.
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, operation]
              properties:
                query:
                  type: object
                  additionalProperties: true
                  description: MongoDB query that identifies the documents to update.
                  example: { "content.status": "Draft" }
                operation:
                  type: object
                  additionalProperties: true
                  description: MongoDB update operation to apply.
                  example: { "$set": { "content.status": "Active" } }
      responses:
        '200':
          description: Returns the number of updated documents or properties.
          content:
            application/json:
              schema:
                type: integer
                example: 1

