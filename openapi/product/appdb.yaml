  #========= Document Endpoints (v2) =========
  /api/datastores/v2/collections/{collectionId}/documents:
    get:
      summary: List Documents
      description: Retrieve documents from a specified collection. There is an upper limit of 10,000 documents per request. Use `limit` and `offset` to paginate through large collections.
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - name: limit
          in: query
          schema: { type: integer }
          description: Maximum number of documents to return.
        - name: offset
          in: query
          schema: { type: integer }
          description: Number of documents to skip before returning. Default is 0.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
              example:
                - id: "a8428d64-a01d-49b2-9144-ddeec001acf8"
                  datastoreId: "39b88a97-8247-4c0d-ba1d-8ed78d1a6680"
                  collectionId: "232e6d6c-46e9-49b6-a137-8933f0f05999"
                  syncRequired: true
                  owner: "870010733"
                  createdBy: "870010733"
                  createdOn: "2026-06-23T20:58:06.567Z"
                  updatedOn: "2026-06-23T23:36:13.177Z"
                  updatedBy: "870010733"
                  content:
                    campaignName: "Q2 Campaign"
                    region: "West"
                    status: "Active"

        '404':
          $ref: '#/components/responses/CollectionNotFound'
    post:
      summary: Create Document
      description: |
        Add a new document to a specified collection.

        <Note>
          **Storing dates:** wrap a value in `$date` to store it as a date rather than text — for example `{"content": {"startDate": {"$date": "2026-01-01T00:00:00Z"}}}`. A plain ISO 8601 string is stored as text, and a value that cannot be read as a date is rejected with `400`. Dates are returned as ISO 8601 strings, not wrapped in `$date`. See [Working with Dates](/portal/API-Reference/Product-APIs/App-DB#working-with-dates).
        </Note>
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentContent'
            examples:
              campaign:
                summary: Campaign document
                value:
                  content: { "campaignName": "Q2 Campaign", "region": "West", "status": "Active" }
              allTypes:
                summary: One of each supported field type
                value:
                  content:
                    name: "Example Record"
                    count: 42
                    unitPriceDecimal: 9.99
                    conversionRateDouble: 0.3333333333333333
                    startDate: {"$date": "2026-06-24T00:00:00Z"}
                    createdAt: {"$date": "2026-06-24T17:42:06.949Z"}
                    isActive: true
                    deletedAt: null
                    address:
                      street: "123 Main St"
                      city: "Austin"
                    tags: ["featured", "new", "sale"]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'

        '400':
          description: 'Bad request. The request body could not be processed — for example, a `$date` value that cannot be read as a date (an ISO 8601 string, epoch milliseconds, or a `$numberLong` wrapper).'
        '404':
          $ref: '#/components/responses/CollectionNotFound'

  /api/datastores/v2/collections/{collectionId}/documents/{documentId}:
    get:
      summary: Get Document
      description: Retrieve a specific document from a collection.
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - name: documentId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the document.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Document with id 'b1e2f3a4-c5d6-7890-abcd-ef1234567890' not found"
                status: 404
                statusReason: "Not Found"
                toe: "1Y7SXEXLME-YM859-UOWZK"

    put:
      summary: Replace Document
      description: |
        Replaces an existing document in a collection — the entire `content` object is overwritten with whatever you send. To update individual fields without replacing the whole document, use the Partially Update Documents endpoint instead.

        <Note>
          **Storing dates:** wrap a value in `$date` to store it as a date rather than text — for example `{"content": {"startDate": {"$date": "2026-01-01T00:00:00Z"}}}`. A plain ISO 8601 string is stored as text, and a value that cannot be read as a date is rejected with `400`. Dates are returned as ISO 8601 strings, not wrapped in `$date`. Because this overwrites the whole `content` object, a date you read from a document and send back unchanged is stored as text — re-wrap it in `$date`. See [Working with Dates](/portal/API-Reference/Product-APIs/App-DB#working-with-dates).
        </Note>
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - name: documentId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the document.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentContent'
            examples:
              campaign:
                summary: Campaign document
                value:
                  content: { "campaignName": "Q2 Campaign", "region": "West", "status": "Inactive" }
              allTypes:
                summary: One of each supported field type
                value:
                  content:
                    name: "Example Record"
                    count: 42
                    unitPriceDecimal: 9.99
                    conversionRateDouble: 0.3333333333333333
                    startDate: {"$date": "2026-06-24T00:00:00Z"}
                    createdAt: {"$date": "2026-06-24T17:42:06.949Z"}
                    isActive: true
                    deletedAt: null
                    address:
                      street: "123 Main St"
                      city: "Austin"
                    tags: ["featured", "new", "sale"]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
              example:
                id: "a8428d64-a01d-49b2-9144-ddeec001acf8"
                datastoreId: "39b88a97-8247-4c0d-ba1d-8ed78d1a6680"
                collectionId: "232e6d6c-46e9-49b6-a137-8933f0f05999"
                syncRequired: true
                owner: "870010733"
                createdBy: "870010733"
                createdOn: "2026-06-23T20:58:06.567Z"
                updatedOn: "2026-06-24T14:22:11.403Z"
                updatedBy: "870010733"
                content:
                  campaignName: "Q2 Campaign"
                  region: "West"
                  status: "Inactive"
        '400':
          description: 'Bad request. The request body could not be processed — for example, a `$date` value that cannot be read as a date (an ISO 8601 string, epoch milliseconds, or a `$numberLong` wrapper).'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Could not find document with id 'b1e2f3a4-c5d6-7890-abcd-ef1234567890' to update"
                status: 404
                statusReason: "Not Found"
                toe: "HKUMCHOWVY-GRVTS-RU3ZG"

    delete:
      summary: Delete Document
      description: Remove a document from a collection.
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - name: documentId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the document.
      responses:
        '204':
          description: The document was successfully deleted. No response body is returned.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Document could not be found: b1e2f3a4-c5d6-7890-abcd-ef1234567890"
                status: 404
                statusReason: "Not Found"
                toe: "BH3HHD53Y3-BZGE0-DQSG3"

  /api/datastores/v2/collections/{collectionId}/documents/bulk:
    post:
      summary: Bulk Create Documents
      description: |
        Add multiple documents to a collection in a single request. Each document is limited to 2 MB.

        <Note>
          **Storing dates:** wrap a value in `$date` to store it as a date rather than text — for example `{"content": {"startDate": {"$date": "2026-01-01T00:00:00Z"}}}`. A plain ISO 8601 string is stored as text, and a value that cannot be read as a date is rejected with `400`. Dates are returned as ISO 8601 strings, not wrapped in `$date`. See [Working with Dates](/portal/API-Reference/Product-APIs/App-DB#working-with-dates).
        </Note>
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DocumentContent'
            example:
              - content: { "campaignName": "Q2 Campaign", "region": "West", "status": "Active" }
              - content: { "campaignName": "Red Campaign", "region": "East", "status": "Inactive" }
      responses:
        '200':
          description: Returns the number of created documents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Created:
                    type: integer
                    description: Number of documents created.
              example:
                Created: 2

        '400':
          description: 'Bad request. The request body could not be processed — for example, a `$date` value that cannot be read as a date (an ISO 8601 string, epoch milliseconds, or a `$numberLong` wrapper).'
        '404':
          $ref: '#/components/responses/CollectionNotFound'
    put:
      summary: Bulk Upsert Documents
      description: |
        Insert or update multiple documents in a single request. Documents with a matching `id` are updated; documents without a matching `id` are created. Each document is limited to 2 MB.

        <Note>
          **Storing dates:** wrap a value in `$date` to store it as a date rather than text — for example `{"content": {"startDate": {"$date": "2026-01-01T00:00:00Z"}}}`. A plain ISO 8601 string is stored as text, and a value that cannot be read as a date is rejected with `400`. Dates are returned as ISO 8601 strings, not wrapped in `$date`. Because this overwrites the whole `content` object, a date you read from a document and send back unchanged is stored as text — re-wrap it in `$date`. See [Working with Dates](/portal/API-Reference/Product-APIs/App-DB#working-with-dates).
        </Note>
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: Document ID to update. Omit to create a new document.
                  content:
                    type: object
                    additionalProperties: true
                    description: Arbitrary JSON content of the document.
            example:
              - id: "a8428d64-a01d-49b2-9144-ddeec001acf8"
                content: { "campaignName": "Q2 Campaign", "region": "West", "status": "Inactive" }
              - content: { "campaignName": "New Campaign", "region": "North", "status": "Active" }
      responses:
        '200':
          description: Returns the number of updated and created documents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Updated:
                    type: integer
                    description: Number of documents updated.
                  Created:
                    type: integer
                    description: Number of documents created.
              example:
                Updated: 1
                Created: 1

        '400':
          description: 'Bad request. The request body could not be processed — for example, a `$date` value that cannot be read as a date (an ISO 8601 string, epoch milliseconds, or a `$numberLong` wrapper).'
        '404':
          $ref: '#/components/responses/CollectionNotFound'
    delete:
      summary: Bulk Delete Documents
      description: "Remove multiple documents from a collection in a single request. IDs are passed as a comma-separated `ids` query parameter. For large batches, keep requests under approximately 800 UUIDs (~30 KB URL) to avoid URL length errors; split larger deletes across multiple requests."
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - name: ids
          in: query
          required: true
          description: A comma-separated list of document IDs.
          schema:
            type: string
          example: "id1,id2,id3"
      responses:
        '202':
          description: Accepted — returns the count of deleted documents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Deleted:
                    type: integer
                    description: Number of documents deleted.
              example:
                Deleted: 2
        '404':
          $ref: '#/components/responses/CollectionNotFound'

  /api/datastores/v2/collections/{collectionId}/documents/update:
    put:
      summary: Partially Update Documents
      description: |
        Perform partial updates on documents using MongoDB query and update operations.
        Returns the number of documents updated. Returns `0` if no documents matched — this is a successful response, not an error.
        `$setOnInsert` has no effect because AppDB partial updates do not perform upserts.

        ## Supported update operators

        `currentDate`, `inc`, `min`, `max`, `mul`, `rename`, `set`, `unset`, `addToSet`, `pop`, `pull`, `pullAll`, `push`

        ## Supported modifiers

        `each`, `position`, `slice`, `sort`

        ## Storing dates

        `$set` accepts a `$date` wrapper, so you can set a field to a real date without rewriting the whole document:
        ```json
        {"operation": {"$set": {"content.startDate": {"$date": "2026-01-01T00:00:00Z"}}}}
        ```
        `$currentDate` also stores a real date. Either way the field is then queryable with `$date` — see [Working with Dates](/portal/API-Reference/Product-APIs/App-DB#working-with-dates).

        This is also the way to repair a field that was accidentally stored as text: `$set` it with a `$date` wrapper.

        See the [MongoDB Update Operators documentation](https://www.mongodb.com/docs/manual/reference/mql/update/) for details.
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, operation]
              properties:
                query:
                  type: object
                  additionalProperties: true
                  description: MongoDB query that identifies the documents to update.
                operation:
                  type: object
                  additionalProperties: true
                  description: MongoDB update operation to apply.
            examples:
              set-field:
                summary: Set a field on matching documents
                value:
                  query:
                    content.status: "Draft"
                  operation:
                    $set:
                      content.status: "Active"
              increment-field:
                summary: Increment a numeric field
                value:
                  query:
                    content.views:
                      $exists: true
                  operation:
                    $inc:
                      content.views: 1
      responses:
        '200':
          description: Returns the number of updated documents or properties.
          content:
            application/json:
              schema:
                type: integer
                example: 1
        '400':
          description: "Bad Request. The request body is missing a required field (`query` or `operation`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "query is required"
                status: 400
                statusReason: "Bad Request"
                toe: "8PJRQYWMHF-NXB3Z-KTZUA"
        '404':
          $ref: '#/components/responses/CollectionNotFound'

  /api/datastores/v2/collections/{collectionId}/download:
    get:
      summary: Download Documents
      description: |
        Download documents in a collection as a JSON file (served with a
        `Content-Disposition: attachment` header). Each entry is a complete document object
        in the same shape accepted by Import Documents.

        <Warning>
          **Hard limit: returns at most 100 documents.** If the collection has more than 100 documents,
          only the first 100 are returned with no error or warning. Use the List Documents endpoint with
          `limit`/`offset` pagination to retrieve larger collections.
        </Warning>

        <Note>
          **Date fields:** dates are written out as ISO 8601 strings rather than `$date` wrappers, so
          importing the file back stores them as text. Re-wrap those fields in `$date` before importing
          if you need them to stay dates. See
          [Working with Dates](/portal/API-Reference/Product-APIs/App-DB#working-with-dates).
        </Note>
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
      responses:
        '200':
          description: JSON array of the documents in the collection.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'

  /api/datastores/v2/collections/{collectionId}/documents/import:
    put:
      summary: Import Documents
      description: |
        Bulk-import complete document objects into a collection — the counterpart to Download
        Documents. Each item must be a full document (including its `id`); documents are
        **upserted by `id`**, so the original `id`, `createdOn`, and `owner` are preserved.
        This is the format produced by Download Documents, which makes the two endpoints a
        copy/restore pair. To add brand-new documents from raw content instead, use Create
        Document. Existing documents not present in the payload are left untouched.

        <Warning>
          **Download/import round trip:** Download Documents returns dates as ISO 8601 strings, and
          an ISO 8601 string imports as text — so any field that was stored as a date comes back as
          text unless you re-wrap it in `$date` before importing, for example
          `{"content": {"startDate": {"$date": "2026-01-01T00:00:00Z"}}}`. The field then stops
          matching `$date` queries, with no error. See
          [Working with Dates](/portal/API-Reference/Product-APIs/App-DB#working-with-dates).
        </Warning>
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Document'
            example:
              - id: "a8428d64-a01d-49b2-9144-ddeec001acf8"
                datastoreId: "39b88a97-8247-4c0d-ba1d-8ed78d1a6680"
                collectionId: "232e6d6c-46e9-49b6-a137-8933f0f05999"
                syncRequired: true
                owner: "870010733"
                createdBy: "870010733"
                createdOn: "2026-06-23T20:58:06.567Z"
                updatedOn: "2026-06-23T23:36:13.177Z"
                updatedBy: "870010733"
                content:
                  username: "bill"
                  email: "bill@example.com"
      responses:
        '200':
          description: >-
            Import completed. Returns counts of the operations performed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Updated:
                    type: integer
                    description: Number of existing documents that were updated.
                  Created:
                    type: integer
                    description: Number of documents created.
                  Upserted:
                    type: integer
                    description: Number of documents inserted via upsert (matched no existing document).
              example:
                Updated: 0
                Created: 0
                Upserted: 1

