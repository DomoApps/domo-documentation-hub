openapi: 3.0.0
info:
  title: App DB API
  version: v1
  description: |
    The App DB API allows developers to interact with AppDB, a NoSQL database 
    for storing arbitrary JSON documents. This API supports CRUD operations, 
    querying, and aggregation, enabling developers to manage data efficiently 
    within their Domo applications.
servers:
  - url: 'https://{instance}.domo.com'
    description: Domo Instance
    variables:
      instance:
        default: 'api'
        description: 'Your specific Domo instance name (e.g., mycompany)'
tags:
  - name: Documents
    description: Manage individual documents in an AppDB collection.
  - name: Collections
    description: Manage AppDB collections (schema, permissions).
  - name: App DB API (Product)
    description: Manage documents and collections in AppDB.
components:
  securitySchemes:
    developerToken:
      type: apiKey
      in: header
      name: X-DOMO-Developer-Token
      description: Domo Developer Token for authentication.
  parameters:
    EntityType:
      name: entity
      in: path
      required: true
      description: The type of entity the permissions apply to.
      schema:
        type: string
        enum: [USER, GROUP, RYUU_APP]
    EntityId:
      name: entityId
      in: path
      required: true
      description: >-
        The ID of the entity the permissions apply to. For a **USER** or **GROUP**, this is the numeric ID (for example, `870010733`). For a **RYUU_APP**, this is the app instance's UUID — the same value as the app's datastore UUID, which also appears as the subdomain of the app's origin (e.g., `https://<instance-uuid>.domoapps.domo.com`).
      schema:
        type: string
      examples:
        userOrGroup:
          summary: User or group (numeric ID)
          value: "870010733"
        app:
          summary: App instance (UUID)
          value: "fcd8baba-9524-4fb5-b94b-b3d3b588e740"
  schemas:
    #========= SHARED SCHEMAS =========
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: A human-readable error message.
        status:
          type: integer
          description: HTTP status code.
        statusReason:
          type: string
          description: HTTP status reason phrase.
        toe:
          type: string
          description: Trace identifier for support; stands for Thread of Execution.
          
    #========= REQUEST BODY SCHEMAS =========
    DocumentContent:
      type: object
      properties:
        content:
          type: object
          additionalProperties: true
          description: "Arbitrary JSON content of the document. If omitted, the document is created with an empty content object."

    #========= RESPONSE SCHEMAS =========
    Document:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the document.
        datastoreId:
          type: string
          description: ID of the datastore the document belongs to.
        collectionId:
          type: string
          description: ID of the collection the document belongs to.
        syncRequired:
          type: boolean
          description: Whether the document is pending a sync to the underlying dataset.
        owner:
          type: string
          description: "User ID of the document owner. v2 endpoints return this as a string; v1 endpoints (List, Get, Query, Update) return it as a numeric integer. This differs from Collection and Datastore owner fields, which are always integers."
        createdBy:
          type: string
          description: "User ID of the user who created the document. v2 endpoints always return this field. v1 endpoints return it only from Create Document; all other v1 endpoints (List, Get, Query, Update) omit it."
        createdOn:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the document was created.
        updatedOn:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the document was last updated.
        updatedBy:
          type: string
          description: "User ID of the user who last updated the document. v2 endpoints return this as a string; v1 endpoints return it as a numeric integer."
        content:
          type: object
          additionalProperties: true
          description: Arbitrary JSON content of the document.
      example:
        id: "a8428d64-a01d-49b2-9144-ddeec001acf8"
        datastoreId: "39b88a97-8247-4c0d-ba1d-8ed78d1a6680"
        collectionId: "232e6d6c-46e9-49b6-a137-8933f0f05999"
        syncRequired: true
        owner: "870010733"
        createdBy: "870010733"
        createdOn: "2026-06-23T20:58:06.567Z"
        updatedOn: "2026-06-23T23:36:13.177Z"
        updatedBy: "870010733"
        content:
          campaignName: "Q2 Campaign"
          region: "West"
          status: "Active"

    QueryRequest:
      type: object
      additionalProperties: true
      description: A MongoDB-style query object.

    CollectionColumn:
      type: object
      properties:
        type:
          type: string
          enum: [STRING, LONG, DECIMAL, DOUBLE, DATE, DATETIME]
        name:
          type: string

    CollectionSummary:
      type: object
      description: Simplified collection object returned by Query Collections.
      properties:
        id:
          type: string
          format: uuid
        owner:
          type: integer
          description: "Numeric user ID of the collection owner. Note: Collection and Datastore owner fields are always integers; Document owner fields differ by endpoint version (see Document schema)."
        name:
          type: string
        syncEnabled:
          type: boolean
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
        documentCount:
          type: integer
          description: Number of documents in the collection.
        datastoreId:
          type: string
          format: uuid
        datastoreName:
          type: string

    CollectionUpdateRequest:
      type: object
      description: "All fields are optional. Only the fields you include are updated; omitted fields are left unchanged."
      properties:
        name:
          type: string
          description: New name for the collection.
        schema:
          type: object
          description: "Updated column schema for this collection. Required before enabling DataSet sync. Requires admin privilege. Valid column types: `STRING`, `LONG`, `DECIMAL`, `DOUBLE`, `DATE`, `DATETIME`. The legacy field name `schemaJson` is also accepted."
          properties:
            columns:
              type: array
              items:
                $ref: '#/components/schemas/CollectionColumn'
        syncEnabled:
          type: boolean
          description: "Whether to enable periodic syncing of documents to a linked Domo DataSet. Returns a 400 if set to `true` and the collection has no schema — set `schema` first."
        fullReplaceRequired:
          type: boolean
          description: Whether the next DataSet sync should fully replace existing rows rather than upsert.
        defaultPermissions:
          type: string
          nullable: true
          description: "Comma-separated default permission set for new app grants on this collection. `READ` is always appended even if omitted. When `null` or blank, defaults to `READ,CREATE_CONTENT,READ_CONTENT,UPDATE_CONTENT,DELETE_CONTENT`. Valid values: `ADMIN`, `SHARE`, `DELETE`, `WRITE`, `READ`, `CREATE_CONTENT`, `READ_CONTENT`, `UPDATE_CONTENT`, `DELETE_CONTENT`. Requires admin privilege."
        owner:
          type: integer
          description: "Numeric user ID to set as the collection owner. Requires admin privilege to change."
        requiredAuthorities:
          type: object
          nullable: true
          description: "Maps `CollectionOperation` names to arrays of authority strings. When set, only users with matching authorities may perform the corresponding operation. Requires admin privilege."
        filters:
          type: array
          nullable: true
          description: "Array of document-level filter predicates applied to read operations on this collection. Requires WRITE permission on the collection."
          items:
            type: object

    Datastore:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the datastore.
        name:
          type: string
          description: Name of the datastore.
        customer:
          type: string
          description: The Domo instance name this datastore belongs to.
        owner:
          type: integer
          description: User ID of the datastore owner.
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
        updatedBy:
          type: integer
          description: User ID of the user who last updated the datastore.
        datastore_id:
          type: integer
          description: "Internal numeric ID for the datastore. Present in Get and List responses; absent in the Create response."
        temporary:
          type: boolean
          description: Whether the datastore is temporary.
      example:
        id: "39b88a97-8247-4c0d-ba1d-8ed78d1a6680"
        name: "My App Datastore"
        customer: "mycompany"
        owner: 870010733
        createdOn: "2024-01-15T18:42:17.293Z"
        updatedOn: "2024-01-15T18:42:17.293Z"
        updatedBy: 870010733
        datastore_id: 125691
        temporary: false

    Collection:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the collection.
        datastoreId:
          type: string
          format: uuid
          description: ID of the datastore this collection belongs to.
        defaultPermissions:
          nullable: true
          description: "Comma-separated default permission set for new app grants on this collection, or null if not set."
        requiredAuthorities:
          nullable: true
          description: "Maps CollectionOperation names to required authority strings, or null if not set."
        owner:
          type: integer
          description: User ID of the collection owner.
        name:
          type: string
          description: Name of the collection.
        datasourceId:
          type: string
          nullable: true
          description: ID of the linked Domo DataSet, or null if not yet linked.
        schema:
          type: object
          properties:
            columns:
              type: array
              items:
                $ref: '#/components/schemas/CollectionColumn'
        filters:
          nullable: true
          description: "Array of document-level filter predicates applied to read operations, or null if not set."
        syncEnabled:
          type: boolean
          description: Whether documents are periodically synced to the linked DataSet.
        syncRequired:
          type: boolean
          description: Whether a sync is pending.
        fullReplaceRequired:
          type: boolean
        lastSync:
          type: string
          format: date-time
          nullable: true
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
        updatedBy:
          type: integer
      example:
        id: "232e6d6c-46e9-49b6-a137-8933f0f05999"
        datastoreId: "39b88a97-8247-4c0d-ba1d-8ed78d1a6680"
        defaultPermissions: null
        requiredAuthorities: null
        owner: 870010733
        name: "users"
        datasourceId: null
        schema:
          columns:
            - type: "STRING"
              name: "username"
            - type: "STRING"
              name: "email"
        filters: null
        syncEnabled: true
        syncRequired: false
        fullReplaceRequired: false
        lastSync: null
        createdOn: "2024-01-15T18:42:30.115Z"
        updatedOn: "2024-01-15T18:42:30.115Z"
        updatedBy: 870010733

  responses:
    CollectionNotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: "Cannot find permission from source [USER:870010733] to target [MAGNUM_COLLECTION:a3f7d891-bc24-4e56-9a12-c7e3b0f845d2]. Permission Service reports that one or both does not exist"
            status: 404
            statusReason: "Not Found"
            toe: "RG3808D5LS-DHKE4-TG5EB"
    CollectionNotFoundDirect:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: "No collection with id a3f7d891-bc24-4e56-9a12-c7e3b0f845d2 found"
            status: 404
            statusReason: "Not Found"
            toe: "UO3SB982DA-RL9G8-GO8DF"
    DatastoreNotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: "Datastore not found"
            status: 404
            statusReason: "Not Found"
            toe: "368PTXPNSC-XVC0X-TBNYZ"

security:
  - developerToken: []

paths:
  #========= Collection Endpoints =========
  /api/datastores/v1/collections:
    get:
      summary: List Collections
      description: Get all collections visible to the current user. Use `datastoreId` to filter by datastore.
      tags:
        - App DB API (Product)
      parameters:
        - name: datastoreId
          in: query
          required: false
          schema: { type: string }
          description: Filter collections by datastore ID.
        - name: shareable
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: When true, returns only collections the current user can share.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Collection'
              example:
                - id: "cf97ef6f-4c7c-4739-9af5-5cc0bd782ddb"
                  datastoreId: "78a89993-3d3a-4b57-a325-1b3886fe1e1b"
                  defaultPermissions: "READ,CREATE_CONTENT,READ_CONTENT,UPDATE_CONTENT,DELETE_CONTENT"
                  requiredAuthorities: null
                  owner: 870010733
                  name: "groups"
                  datasourceId: null
                  schema: null
                  filters: null
                  syncEnabled: false
                  syncRequired: false
                  fullReplaceRequired: false
                  lastSync: null
                  createdOn: "2026-06-24T20:09:12.502Z"
                  updatedOn: "2026-06-24T20:09:12.502Z"
                  updatedBy: 870010733
                - id: "8050a95f-7865-4ed9-bbeb-a82eaf1d1c41"
                  datastoreId: "f812ea02-0e52-478b-90f0-00aad7e05029"
                  defaultPermissions: null
                  requiredAuthorities: null
                  owner: 870010733
                  name: "users"
                  datasourceId: "de683ed7-eb83-4799-a9c7-876da6b5b008"
                  schema:
                    columns:
                      - type: "STRING"
                        name: "username"
                      - type: "DATETIME"
                        name: "joined"
                  filters: null
                  syncEnabled: true
                  syncRequired: false
                  fullReplaceRequired: false
                  lastSync: "2026-06-24T21:42:28Z"
                  createdOn: "2026-06-24T21:35:39.593Z"
                  updatedOn: "2026-06-24T21:42:28.493Z"
                  updatedBy: 870010733
    post:
      summary: Create Collection
      description: |
        Create a new collection in a datastore. Pass `datastoreId` as a query parameter.

        If you plan to use sync, note the following:

        <Note>
        **Date formatting:** A `DATE` or `DATETIME` column accepts a value stored as a date (write it with `$date`), an ISO 8601 string in `YYYY-MM-DD` or `YYYY-MM-DDTHH:MM:SSZ` form, or epoch milliseconds. All three sync to a real date in the DataSet, so collections already writing date strings need no change.

        Note that syncing correctly is not the same as being queryable as a date: a field stored as a string is a real date in the DataSet but still text to AppDB queries. See [Working with Dates](/portal/API-Reference/Product-APIs/App-DB#working-with-dates).
        </Note>

        <Warning>
        **Only top-level fields can be synced.** Column names must be **top-level keys** in the document's `content` object; dot notation does not traverse nested objects during sync. To include a nested object, use the top-level key name (e.g., `wand`) — the synced value will be the JSON string representation of that object (e.g., `{"wood":"holly","core":"phoenix feather","length":11}`).
        </Warning>

        <Warning>
        **Incorrect schema types prevent DataSet creation.** The accepted column types are `STRING` · `LONG` · `DECIMAL` · `DOUBLE` · `DATE` · `DATETIME`. If your AppDB DataSet doesn't appear after 15 minutes, verify your schema uses only these values — common mistakes include `NUMBER` or `INTEGER`.
        </Warning>

        <Warning>
        **Collections won't sync if the collection owner lacks permissions on the target DataSet.** If that user is removed from Domo, syncing stops. The new owner must have both Collection ownership and Admin Permissions.
        </Warning>
      tags:
        - App DB API (Product)
      parameters:
        - name: datastoreId
          in: query
          required: true
          schema: { type: string }
          description: The ID of the datastore to create the collection in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name for the collection.
                syncEnabled:
                  type: boolean
                  description: "Whether to enable periodic syncing to a linked Domo DataSet. Requires `schema` to be provided; the API returns a 400 if `syncEnabled: true` is passed without a schema."
                schema:
                  type: object
                  properties:
                    columns:
                      type: array
                      items:
                        $ref: '#/components/schemas/CollectionColumn'
            example:
              name: "users"
              syncEnabled: true
              schema:
                columns:
                  - name: "username"
                    type: "STRING"
                  - name: "email"
                    type: "STRING"
      responses:
        '201':
          description: Collection created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          description: "Bad Request. Common causes: `syncEnabled: true` was passed without a `schema`; or the required `name` field was missing."

  /api/datastores/v1/collections/query:
    post:
      summary: Query Collections
      description: Filter and sort collections using field-level predicates with pagination.
      tags:
        - App DB API (Product)
      parameters:
        - name: ownedBy
          in: query
          required: false
          schema: { type: boolean, default: true }
          description: Include a summary of collections grouped by owner in the response.
        - name: createdOn
          in: query
          required: false
          schema: { type: boolean, default: true }
          description: Include a summary of collections grouped by creation date in the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionFilteringList:
                  type: array
                  items:
                    type: object
                    properties:
                      filterType:
                        type: string
                        enum: [datastorename, ownedby, createddate, nameof]
                        description: "`datastorename` — filter by the app/card name. `ownedby` — filter by owner user ID. `createddate` — filter by creation date. `nameof` — filter by collection name."
                      not:
                        type: boolean
                        nullable: true
                        description: When true, inverts the filter (supported for `ownedby`, `createddate` with `on`, and `nameof`).
                      comparingCriteria:
                        type: string
                        nullable: true
                        description: "Required for `createddate`. One of: `after`, `before`, `on`."
                      typedValue:
                        type: string
                        description: "The value to filter on: a user ID for `ownedby`, an ISO date for `createddate`, or a name string for `nameof` and `datastorename`."
                sortBy:
                  type: string
                  description: "Field to sort by. One of: `documentCount`, `createdOn`, `updatedOn`, `name`, `datastoreName`."
                direction:
                  type: string
                  enum: [ASC, DESC]
                pageSize:
                  type: integer
                  default: -1
                  description: "Number of results per page. Pass `-1` to return all results."
                pageNumber:
                  type: integer
                  default: -1
                  description: "1-indexed page number. Pass `-1` to return all results."
            example:
              collectionFilteringList:
                - filterType: "nameof"
                  typedValue: "users"
              sortBy: "createdOn"
              direction: "DESC"
              pageSize: 25
              pageNumber: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCollectionCount:
                    type: integer
                  pageSize:
                    type: integer
                  pageNumber:
                    type: integer
                  pageCount:
                    type: integer
                  collections:
                    type: array
                    items:
                      $ref: '#/components/schemas/CollectionSummary'
                  ownedBy:
                    type: array
                    description: Aggregate of collections grouped by owner. Present when the `ownedBy` query parameter is true (default).
                    items:
                      type: object
                      properties:
                        ownerId:
                          type: string
                        ownerName:
                          type: string
                        collectionCount:
                          type: integer
                  createdOn:
                    type: object
                    description: Aggregate of collections grouped by creation date. Present when the `createdOn` query parameter is true (default).
                    properties:
                      sevenDaysAgo:
                        type: integer
                      fifteenDaysAgo:
                        type: integer
                      thirtyDaysAgo:
                        type: integer
              example:
                totalCollectionCount: 1
                pageSize: 1
                pageNumber: 1
                pageCount: 1
                collections:
                  - id: "232e6d6c-46e9-49b6-a137-8933f0f05999"
                    owner: 870010733
                    name: "users"
                    syncEnabled: true
                    createdOn: "2024-01-15T18:42:30.115Z"
                    updatedOn: "2024-01-15T18:42:30.115Z"
                    documentCount: 42
                    datastoreId: "39b88a97-8247-4c0d-ba1d-8ed78d1a6680"
                    datastoreName: "My App Datastore"
                ownedBy:
                  - ownerId: "870010733"
                    ownerName: "Jane Smith"
                    collectionCount: 1
                createdOn:
                  sevenDaysAgo: 0
                  fifteenDaysAgo: 1
                  thirtyDaysAgo: 1

  /api/datastores/v1/collections/{collectionId}:
    get:
      summary: Get Collection
      description: Get a collection by ID.
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '404':
          $ref: '#/components/responses/CollectionNotFound'
    put:
      summary: Update Collection
      description: "Update one or more fields on a collection. All request body fields are optional — only the fields you include are changed."
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionUpdateRequest'
            examples:
              rename:
                summary: Rename a collection
                value:
                  name: "My new name"
              update-schema:
                summary: Update schema
                value:
                  schema:
                    columns:
                      - type: STRING
                        name: theme
                      - type: STRING
                        name: defaultView
                  syncEnabled: true
              rename-and-update-schema:
                summary: Rename and update schema
                value:
                  name: "preferences"
                  schema:
                    columns:
                      - type: STRING
                        name: theme
                      - type: STRING
                        name: defaultView
                  syncEnabled: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '404':
          $ref: '#/components/responses/CollectionNotFoundDirect'
    delete:
      summary: Delete Collection
      description: Permanently delete a collection and all of its documents.
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection to delete.
      responses:
        '204':
          description: Collection deleted. No response body is returned.
        '404':
          $ref: '#/components/responses/CollectionNotFound'

  /api/datastores/v1/collections/{collectionId}/permission/{entity}/{entityId}:
    put:
      summary: Update Permissions
      description: |
        Grant or replace permissions for a user, group, or app instance on a collection.

        ## Permission Inheritance

        Users and groups inherit permissions from the app, so often the most convenient approach is to give the app the permissions you want all users to have. Anyone who has the app card shared with them inherits its permissions on the collection and its documents. By default, apps receive `read`, `create_content`, `read_content`, `update_content`, and `delete_content` on their collections.

        For finer-grained control — when not everyone should be able to create, update, or delete documents — grant permissions directly to individual users or groups instead.

        ## Available Permissions

        | Permission       | Grants |
        | ---------------- | ------ |
        | `admin`          | All permissions to the collection and its documents |
        | `write`          | Update the collection's properties |
        | `read`           | Read the collection's properties |
        | `share`          | Add or remove permissions this entity already holds |
        | `delete`         | Delete the collection |
        | `create_content` | Create documents in the collection |
        | `update_content` | Update documents in the collection |
        | `read_content`   | Read documents in the collection |
        | `delete_content` | Delete documents from the collection |

        `READ` is always included in the resulting permission set, even if you do not specify it.

        Removing all entity permissions leaves only users with the **Manage AppDB** grant with access.
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - $ref: '#/components/parameters/EntityType'
        - $ref: '#/components/parameters/EntityId'
        - name: permissions
          in: query
          required: true
          description: One or more permissions to apply. Pass as a comma-separated list.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - admin
                - write
                - read
                - share
                - delete
                - create_content
                - update_content
                - read_content
                - delete_content
          example: "read,create_content,read_content,update_content,delete_content"
        - name: overwrite
          in: query
          required: false
          description: |
            Controls how the specified permissions are applied to the entity's existing permission set.

            - `false` (default) — **additive**: merges the specified permissions with any permissions the entity already holds.
            - `true` — **replace**: discards the entity's existing permissions and replaces them with exactly the permissions you specify. `READ` is still always included in the resulting set.
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: Permissions updated successfully. No response body is returned.
        '400':
          description: >-
            The request could not be validated — for example, the `entityId` does not resolve to an existing entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Unable to verify user with id 1"
                status: 400
                statusReason: "Bad Request"
                toe: "X1EIQPAW9O-YR1AP-0WM59"
        '403':
          description: "Forbidden. The collection does not exist or the caller does not have the `share` permission on it."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "The item you're looking for can not be found"
                status: 403
                statusReason: "Forbidden"
                toe: "GP0ITH3EYK-UTED0-8ZCS2"
        '404':
          $ref: '#/components/responses/CollectionNotFoundDirect'
    delete:
      summary: Delete Permissions
      description: |
        Remove all permissions for a user, group, or app instance on a collection.

        This operation is idempotent: removing permissions for an entity that currently has none still returns `204`.

        <Note>
        If all entities' permissions are removed, then only users with the **Manage AppDB** grant will still have access.
        </Note>
      tags:
        - App DB API (Product)
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
          description: The ID of the collection.
        - $ref: '#/components/parameters/EntityType'
        - $ref: '#/components/parameters/EntityId'
      responses:
        '204':
          description: Permissions removed successfully. No response body is returned.
        '403':
          description: "Forbidden. The caller does not have the `share` permission on this collection."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 403
                toe: "4BTZ5Z37R0-WR4VI-YS9Y4"
        '404':
          $ref: '#/components/responses/CollectionNotFoundDirect'

